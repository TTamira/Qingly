   ============================================================ */
/* 本地日期字符串（原 toISOString 在北京时间 0–8 点会落到前一天，影响每日打卡归属） */
function isoOf(dt){ const p=n=>String(n).padStart(2,"0"); return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`; }
function isoToday(){ return isoOf(new Date()); }
function today(){ return isoToday(); }
/* ---------- 循环计划：单条记录 + doneOn 日期打卡，不物化每日实例 ---------- */
const REP_SHORT=["日","一","二","三","四","五","六"];
function isRepeat(t){ return !!(t&&t.repeat&&t.repeat.kind&&t.repeat.kind!=="none"); }
function repDays(r){ if(!r) return [];
  if(r.kind==="daily") return [0,1,2,3,4,5,6];
  if(r.kind==="weekday") return [1,2,3,4,5];
  return (r.days||[]).map(Number).filter(d=>d>=0&&d<=6); }
/* 某天是否被规则排到：暂停 / 未开始 / 已结束都不排 */
function repActive(t,iso){ if(!isRepeat(t)) return true; const r=t.repeat;
  if(r.paused) return false;
  if(r.start&&iso<r.start) return false;
  if(r.until&&iso>r.until) return false;
  return repDays(r).includes(new Date(iso+"T00:00:00").getDay()); }
function repDone(t,iso){ return (t.doneOn||[]).includes(iso); }
/* 同一天只保留一条记录：重复点击只会勾掉，不会重复计数 */
function repToggle(t,iso){ const a=(t.doneOn=t.doneOn||[]); const i=a.indexOf(iso);
  if(i>=0) a.splice(i,1); else a.push(iso); }
function todoDone(t){ return isRepeat(t)?repDone(t,today()):!!t.done; }
function todoToggle(t){ if(isRepeat(t)){ repToggle(t,today()); return; }
  t.done=!t.done; if(t.done&&!t.date) t.date=today(); }
function todoApplies(t,iso){ return !isRepeat(t)||repActive(t,iso||today()); }
/* 是否已安排进今日计划：sched 缺省（旧数据）视为已安排；
   目标树拆出的「执行任务」默认 sched=false，只属于目标树，主动「安排」后才进今日计划。
   sched 只影响展示与每日安排，不影响任务归属与目标进度（nodePct 不看它）。 */
function inPlan(t){ return !!t && t.sched!==false; }
function weekDates(){ const d=new Date(today()+"T00:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7));
  const out=[]; for(let i=0;i<7;i++){ const c=new Date(d); c.setDate(d.getDate()+i); out.push(isoOf(c)); } return out; }
function repWeekStat(t){ let total=0,done=0;
  weekDates().forEach(iso=>{ if(repActive(t,iso)){ total++; if(repDone(t,iso)) done++; } });
  return {done,total}; }
function repText(t){ const r=(t&&t.repeat)||{}; if(r.paused) return "已暂停";
  if(r.until&&today()>r.until) return "已结束";
  if(r.kind==="daily") return "每天"; if(r.kind==="weekday") return "工作日";
  const ds=repDays(r); return ds.length?"每周"+ds.map(d=>REP_SHORT[d]).join(""):"未设日期"; }
function avgProgress(list){
  if(!list||!list.length) return { value:0, sub:"0" };
  const v = Math.round(list.reduce((s,x)=>s+Math.min(100,(x.current/x.target)*100||0),0)/list.length);
  return { value:v, sub:`${list.length} 项` };
}
const modOf = k => CONFIG.modules.find(m=>m.key===k);
const $ = s => document.querySelector(s);

/* 排期分组 → 主题模块色（用 CSS 变量，随主题自动适配；
   色相差异够大，浅底区分弱时靠格子顶部实色条兜底） */

/* 排期时间段：把 {from,to} 展开成每一天的 ISO 日期列表（兼容旧的单日 date 字段；范围超长时截断保护） */
function schedDates(x){
  const f=String(x.from||x.date||"").slice(0,10);
  const t=String(x.to||f||"").slice(0,10);
  if(!f) return [];
  let d=new Date(f+"T00:00:00"), e=new Date(t+"T00:00:00");
  if(d>e){ const tmp=d; d=e; e=tmp; }
  const cap=new Date(d); cap.setDate(cap.getDate()+399);   // 单条排期最多展开 400 天，防异常数据拖垮渲染
  if(e>cap) e=cap;
  const out=[];
  for(; d<=e; d.setDate(d.getDate()+1)) out.push(d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()));
  return out;
}
/* 排期时间段显示文案：同天只显示一天，跨天显示 起 ~ 止 */
function schRangeText(x){
  const f=String(x.from||x.date||"").slice(0,10);
  const t=String(x.to||f||"").slice(0,10);
  return (!f||!t||f===t) ? f : `${f} ~ ${t}`;
}

/* 三类数据桶：工作 / 私人 / 本地。本地资料独立存储，不参与同步。
   运行时合并成一个 data 对象；保存时按 space 拆回各自的桶。 */
const PRIVATE_KEY = "workbench-private-v1";
const LOCAL_KEY   = "workbench-local-v1";
const SCHEMA_VERSION = 2;   // 数据模型版本号，迁移时对比用（v2：排期 date → from/to 时间段）

const spaceOf = m => m.space || "work";
const bucketOf = k => { const m=modOf(k); if(!m) return "work"; const s=spaceOf(m); return s==="private"?"private": s==="local"?"local":"work"; };
const curMode = () => (data && data.__mode==="private" ? "private" : "work");
const visibleModules = () => CONFIG.modules.filter(m => { const s=spaceOf(m); return s==="both" || s==="local" || s===curMode(); });

/* ===== store 统一数据访问层 ===== */
const store = {
  load(){
    const read=k=>{ let o=null; try{ const raw=localStorage.getItem(k); if(raw) o=JSON.parse(raw); }catch(e){} return (o && typeof o==="object" && !Array.isArray(o)) ? o : {}; };
    // 三个桶合并成运行时数据
    const d = Object.assign(read(CONFIG.storageKey), read(PRIVATE_KEY), read(LOCAL_KEY));
    CONFIG.modules.forEach(m=>{ if(!Array.isArray(d[m.key])) d[m.key]=JSON.parse(JSON.stringify(m.seed||[])); });
    // 配置项从主桶继承
    const cfg = read(CONFIG.storageKey);
    ["__theme","__homeLayout","__owner","__slogan","__mode","__status","eye","eyeCfg","__avatar"].forEach(k=>{ if(k in cfg) d[k]=cfg[k]; });
    // 本地资料的 READER_KEY 独立存储桶，和 docs 模块不混
    // docs 模块数据进 local 桶，READER_KEY 保持原样
    return d;
  },
  save(){
    const work={}, priv={}, local={};
    Object.keys(data).forEach(k=>{
      const b = bucketOf(k);
      if(b==="private") priv[k]=data[k];
      else if(b==="local") local[k]=data[k];
      else work[k]=data[k];
    });
    // 配置项（__theme 等）也进主桶
    ["__theme","__homeLayout","__owner","__slogan","__mode","__status","eye","eyeCfg","__avatar","__schemaVersion"].forEach(k=>{ if(k in data) work[k]=data[k]; });
    try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(work)); }catch(e){}
    try{ localStorage.setItem(PRIVATE_KEY, JSON.stringify(priv)); }catch(e){}
    try{ localStorage.setItem(LOCAL_KEY,   JSON.stringify(local)); }catch(e){}
  },

  /* —— 渐进式改造：新代码用 get/set，老代码先不动 —— */
  get(key){ return data[key]; },
  set(key, value){ data[key]=value; this.save(); },

  /* —— 数据迁移：v0 → v1 —— */
  migrate(){
    const curVer = (data && typeof data.__schemaVersion==="number") ? data.__schemaVersion : 0;
    if(curVer >= SCHEMA_VERSION) return { ok:true, skipped:true, msg:"已是最新版本" };

    const beforeCounts = {};  // 迁移前记录数
    CONFIG.modules.forEach(m=>{ if(Array.isArray(data[m.key])) beforeCounts[m.key]=data[m.key].length; });

    try{
      // 1. docs 模块：space 标记从 "both" 改为 "local"（CONFIG.modules 已改，数据自然会进 local 桶）
      //    之前 docs 数据可能在 work 桶里，不用手动搬——下次 save 时 bucketOf("docs") 会自动归到 local

      // 2. 为每条记录补同步元数据
      CONFIG.modules.forEach(m=>{
        const list = data[m.key];
        if(!Array.isArray(list)) return;
        list.forEach((rec, i) => {
          // 补 space 字段（记录级）
          if(typeof rec.space !== "string" || !["work","private","local"].includes(rec.space)){
            rec.space = spaceOf(m);  // 按模块归属
          }
          // 补 createdAt（从现有 date 字段推导，无则用当前时间）
          if(!rec.createdAt){
            if(rec.date) rec.createdAt = rec.date + "T00:00:00.000Z";
            else rec.createdAt = new Date().toISOString();
          }
          // 补 updatedAt（同 createdAt）
          if(!rec.updatedAt) rec.updatedAt = rec.createdAt;
          // 补 version
          if(typeof rec.version !== "number") rec.version = 1;
          // 补 deletedAt
          if(!rec.hasOwnProperty("deletedAt")) rec.deletedAt = null;
          // 补 id（整数 → UUID，旧整数保留，新创建的用 UUID）
          if(typeof rec.id !== "number" && typeof rec.id !== "string"){
            rec.id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2,6);
          }
          // 递归处理 goal 的 children（目标树是嵌套结构）
          if(Array.isArray(rec.children)) this._migrateGoalTree(rec.children, spaceOf(m));
        });
      });

      // 3. 排期 v1→v2：旧单日 date 迁移成时间段 from/to（不删 date，供 schedDates 兼容回退）
      const schedList = data["schedule"];
      if(Array.isArray(schedList)){
        schedList.forEach(rec=>{
          if(!rec.from && rec.date){ rec.from = String(rec.date).slice(0,10); }
          if(!rec.to){ rec.to = rec.from || String(rec.date||"").slice(0,10) || null; }
        });
      }

      // 4. 配置项补 schemaVersion
      data.__schemaVersion = SCHEMA_VERSION;

      // 5. 核对数据量
      const afterCounts = {};
      CONFIG.modules.forEach(m=>{ if(Array.isArray(data[m.key])) afterCounts[m.key]=data[m.key].length; });
      let ok = true;
      let diffs = [];
      CONFIG.modules.forEach(m=>{
        if(beforeCounts[m.key] !== afterCounts[m.key]){
          ok = false;
          diffs.push(`${m.key}: ${beforeCounts[m.key]}→${afterCounts[m.key]}`);
        }
      });

      if(!ok){
        console.error("数据迁移核对失败！数量不一致:", diffs);
        return { ok:false, error:"数据量核对失败", diffs };
      }

      this.save();
      return { ok:true, skipped:false, msg:`数据已升级到 v${SCHEMA_VERSION}` };
    }catch(e){
      console.error("数据迁移失败！", e);
      return { ok:false, error:e.message };
    }
  },

  /* 递归处理目标树节点的同步元数据 */
  _migrateGoalTree(nodes, defaultSpace){
    nodes.forEach(n=>{
      if(typeof n.space !== "string") n.space = defaultSpace;
      if(!n.createdAt){ n.createdAt = new Date().toISOString(); }
      if(!n.updatedAt) n.updatedAt = n.createdAt;
      if(typeof n.version !== "number") n.version = 1;
      if(!n.hasOwnProperty("deletedAt")) n.deletedAt = null;
      if(typeof n.id !== "number" && typeof n.id !== "string"){
        n.id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      }
      if(Array.isArray(n.children)) this._migrateGoalTree(n.children, defaultSpace);
    });
  },
};

let data = store.load();

/* —— 启动时自动执行数据迁移 —— */
const _migrateResult = store.migrate();
if(_migrateResult.ok && !_migrateResult.skipped){
  console.log("✓", _migrateResult.msg);
  // 首次迁移给用户一个无声提示（不打断）
  setTimeout(()=>{ try{ toast && toast(_migrateResult.msg); }catch(e){} }, 500);
} else if(!_migrateResult.ok){
  console.error("✗ 数据迁移失败：", _migrateResult.error);
  try{ toast && toast("数据迁移失败，请联系开发者"); }catch(e){}
}

/* ---------- 目标拆解（方向 → 总目标 → 阶段目标 → 子目标… → 执行任务） ----------
   目标树不绑定时间周期，层数不固定：任意节点都能继续加子目标，也可以逐步拆解。
   进度自下而上汇总：叶子节点 = 它下面「执行任务」的完成比例；
   其余节点 = 自身任务与直接子目标等权合并。
   「执行任务」不单独存一份，就是「今日计划」里关联了该节点（任意层级）的任务（goalId）。
   解耦规则：任务是否进「今日计划」由 sched 决定（sched!==false 才显示在今日计划）；
   目标树新建的执行任务默认 sched=false，用户主动「安排」后才进今日计划。 */
const GOAL_LEVELS=[
  { key:"direction", name:"方向",    icon:"compass",  color:"var(--module-2)", tint:"#edf1f5" },
  { key:"goal",      name:"总目标",  icon:"target",   color:"var(--module-5)", tint:"#f1eef4" },
  { key:"stage",     name:"阶段目标",icon:"layers",   color:"var(--module-1)", tint:"#eef3ec" },
  { key:"week",      name:"子目标",  icon:"leaf",     color:"var(--module-3)", tint:"#f6f0e6" },
];
const GOAL_LV={}; GOAL_LEVELS.forEach(l=>GOAL_LV[l.key]=l);
const GOAL_NEXT={ direction:"goal", goal:"stage", stage:"week" };   // 只是「新建时的默认层级」，不限制实际层数

/* 旧版「长期计划」数据（一键 +1 那种）自动并入新结构，避免老用户打开就空 */
function migrateGoal(){
  const g=data.goal; if(!Array.isArray(g)||!g.length) return;
  if(g.every(n=>n&&n.lv)) return;                                   // 已经是新结构
  const kids=g.map((n,i)=>({ id:n.id||(Date.now()+i), lv:"goal", title:n.title||"未命名", deadline:n.deadline||"", children:[] }));
  data.goal=[{ id:Date.now(), lv:"direction", title:"🎯 我的方向", stage:"", week:"", children:kids }];
}
migrateGoal();

/* 某个节点下面挂着的「执行任务」= 今日计划数据里关联过来的任务（任意层级都可以挂） */
function tasksOf(node){ return (data.todo||[]).filter(x=>String(x.goalId)===String(node.id)); }
const weekTasks=tasksOf;
/* 空节点：已归档算空；手动/完成状态模式即使没任务也算有内容；否则看任务与子目标（有任务就算内容，循环打卡也算） */
function nodeEmpty(node){
  if(!node||node.archived) return true;
  if(node.pMode==="manual"||node.pMode==="check") return false;
  if(tasksOf(node).length) return false;
  return !(node.children||[]).some(k=>!k.archived&&!nodeEmpty(k));
}
/* 单节点进度：手动/完成状态直接给值；自动模式 = 自身任务完成率 + 有内容的直接子目标平均，等权合并。
   任务层按「每条任务一票」平铺平均：一次性任务完成记 100 未完成记 0；
   循环任务按本周完成率（已打卡/应打卡）折算，本周无排期（暂停/结束/未设日期）的不进分母 */
function nodePct(node){
  if(!node||node.archived) return 0;
  if(node.pMode==="manual") return Math.max(0,Math.min(100,Math.round(+node.pManual||0)));
  if(node.pMode==="check") return node.pDone?100:0;
  const parts=[];
  tasksOf(node).forEach(t=>{
    if(isRepeat(t)){ const s=repWeekStat(t); if(s.total>0) parts.push(s.done/s.total*100); }
    else parts.push(t.done?100:0);
  });
  const kids=(node.children||[]).filter(k=>!k.archived&&!nodeEmpty(k));
  if(kids.length) parts.push(kids.reduce((s,k)=>s+nodePct(k),0)/kids.length);
  return parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):0;
}
function goalAvg(list){ const all=list||[]; const alive=all.filter(n=>!n.archived); const valid=alive.filter(n=>!nodeEmpty(n));
  if(!valid.length) return { value:0, sub:`${alive.length} 个方向` };
  return { value:Math.round(valid.reduce((s,n)=>s+nodePct(n),0)/valid.length), sub:`${alive.length} 个方向` };
}
/* id → { node, parentNode, path } 索引：查找、路径标签、所属目标下拉都用它 */
function goalIndex(){ const map={};
  const walk=(nodes,path,parentNode)=>{ (nodes||[]).forEach(n=>{ map[n.id]={node:n,parentNode,path}; walk(n.children,path.concat([n.title]),n); }); };
  walk(data.goal||[],[],null); return map;
}
function goalFind(id){ const e=goalIndex()[id]; return e?e.node:null; }
/* 从方向到该节点的完整链路（根 → 当前节点），用于判断节点归属哪个方向 */
function goalChainOf(id){ let out=null;
  const walk=(nodes,chain)=>{ (nodes||[]).forEach(n=>{ if(out) return;
    const c=chain.concat([n]);
    if(String(n.id)===String(id)){ out=c; return; }
    walk(n.children,c); }); };
  walk(data.goal||[],[]); return out||[]; }
/* 节点自身或任一上级已归档 → 不在当前树里，也不进树统计 */
function goalHidden(id){ const chain=goalChainOf(id); return !chain.length || chain.some(n=>n.archived); }
/* 执行任务可关联的目标候选（除方向外的任意层级，层数不限）；传 dirId 时只返回该方向下的节点 */
function weekOptions(dirId){
  const dir=(dirId==null||dirId==="")?null:String(dirId);
  return Object.entries(goalIndex()).filter(([id,e])=>e.node.lv!=="direction"&&!goalHidden(e.node.id))
    .map(([id,e])=>{ const chain=goalChainOf(e.node.id);
      return { id:+id, label:e.path.concat([e.node.title]).join(" / "), short:e.node.title,
               dirId:chain.length?chain[0].id:null }; })
    .filter(o=>!dir||String(o.dirId)===dir); }
/* 节点整棵子树的 id（含自身）：删除时用来解除所有层级的任务关联 */
function goalSubtreeIds(node){ const ids=[String(node.id)];
  const walk=ns=>(ns||[]).forEach(k=>{ ids.push(String(k.id)); walk(k.children); });
  walk(node.children); return ids; }
/* 删除节点：只移除树结构；它和所有子项关联的任务一律保留在今日计划，仅解除关联 */
function goalRemove(id){ const e=goalIndex()[id]; if(!e) return 0;
  const ids=new Set(goalSubtreeIds(e.node));
  if(e.parentNode) e.parentNode.children=(e.parentNode.children||[]).filter(c=>String(c.id)!==String(id));
  else data.goal=(data.goal||[]).filter(c=>String(c.id)!==String(id));
  let n=0;
  (data.todo||[]).forEach(t=>{ if(t.goalId&&ids.has(String(t.goalId))){ t.goalId=""; n++; } });
  return n;
}
function goalCount(){
  const n={ direction:0, goal:0, stage:0, week:0,
            task:(data.todo||[]).filter(t=>t.goalId&&!goalHidden(t.goalId)&&!isRepeat(t)).length };   // 归档子树与循环打卡不计入「关联任务」
  const walk=ns=>(ns||[]).forEach(x=>{ if(x.archived) return; if(n[x.lv]!=null) n[x.lv]++; walk(x.children); });
  walk(data.goal); return n;
}
function goalTreeCount(node){ let c=1; (node.children||[]).forEach(k=>c+=goalTreeCount(k)); return c; }
function weekDoneCount(){ let c=0; const ix=goalIndex(); Object.values(ix).forEach(e=>{ if(e.node.lv==="week"&&!goalHidden(e.node.id)&&nodePct(e.node)>=100) c++; }); return c; }
/* 归档节点：只标记 archived，不删数据；子树随之隐藏，恢复后原样回来 */
function goalArchive(node){ if(!node) return; node.archived=true; node.archivedAt=Date.now(); }
function goalUnarchive(node){ if(!node) return; delete node.archived; delete node.archivedAt; }
function archivedNodes(){ const out=[];
  const walk=(ns,path)=>(ns||[]).forEach(n=>{ if(n.archived) out.push({node:n,path});
    walk(n.children,path.concat([n.title])); });
  walk(data.goal,[]); return out; }

const L_GAN="甲乙丙丁戊己庚辛壬癸", L_ZHI="子丑寅卯辰巳午未申酉戌亥";
const L_MON=["正","二","三","四","五","六","七","八","九","十","冬","腊"];
const L_DAYS=["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
function lYearDays(y){ let sum=348; for(let i=0x8000;i>0x8;i>>=1) sum+=(LUN_INFO[y-1900]&i)?1:0; return sum+lLeapDays(y); }
function lLeapMonth(y){ return LUN_INFO[y-1900]&0xf; }
function lLeapDays(y){ if(lLeapMonth(y)) return (LUN_INFO[y-1900]&0x10000)?30:29; return 0; }
function lMonthDays(y,m){ return (LUN_INFO[y-1900]&(0x10000>>m))?30:29; }
function lunarOf(date){
  let offset=(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.UTC(1900,0,31))/86400000;
  let i=1900, temp=0;
  for(; i<2101 && offset>0; i++){ temp=lYearDays(i); offset-=temp; }
  if(offset<0){ offset+=temp; i--; }
  let year=i, leap=lLeapMonth(year), isLeap=false;
  for(i=1; i<13 && offset>0; i++){
    if(leap>0 && i==(leap+1) && !isLeap){ --i; isLeap=true; temp=lLeapDays(year); }
    else temp=lMonthDays(year,i);
    if(isLeap && i==(leap+1)) isLeap=false;
    offset-=temp;
  }
  if(offset==0 && leap>0 && i==leap+1){ if(isLeap) isLeap=false; else { isLeap=true; --i; } }
  if(offset<0){ offset+=temp; --i; }
  const yearName=L_GAN[(year-4)%10]+L_ZHI[(year-4)%12];
  const animal="鼠牛虎兔龙蛇马羊猴鸡狗猪"[(year-4)%12];
  return `${yearName}年 · ${isLeap?"闰":""}${L_MON[i-1]}月${L_DAYS[offset]}`;
}

/* ---------- ring svg ---------- */
function ringSVG(pct, color){
  const r=25, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return `<svg class="gauge" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--border)" stroke-width="5.5"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

/* 今日聚焦：跨模块置顶任务（就地交互，不跳转） */
function focusTileHTML(){
  const pins=[]; visibleModules().forEach(m=>(data[m.key]||[]).forEach(x=>{ if(x.pinned) pins.push({m,x}); }));
  const chk=icon("check",13,2.6);
  const sub=(m,x)=>{
    if(m.type==="checkin") return `${m.name} · 连续 ${streak(x.log)} 天`;
    if(m.type==="progress"){ const p=Math.min(100,Math.round((x.current/x.target)*100||0)); return `${m.name} · ${x.current}/${x.target} ${x.unit||m.unit||''} · ${p}%`; }
    return m.name;
  };
  const ctl=(m,x)=>{
    if(m.type==="checkin"){ const on=!!(x.log&&x.log[today()]); return `<div class="pin-chk js-pin-chk ${on?'on':''}" data-mkey="${m.key}" data-id="${x.id}">${chk}</div>`; }
    if(m.type==="todo"){ return `<div class="pin-chk js-pin-chk ${todoDone(x)?'on':''}" data-mkey="${m.key}" data-id="${x.id}">${chk}</div>`; }
    if(m.type==="progress"){ return `<div class="pin-step"><button class="js-pin-dec" data-mkey="${m.key}" data-id="${x.id}">−</button><button class="js-pin-inc" data-mkey="${m.key}" data-id="${x.id}">+</button></div>`; }
    return `<span style="color:var(--text-tertiary)">${icon("chevron",16,2)}</span>`;
  };
  const rows = pins.length ? pins.map(({m,x})=>`<div class="focus-row">
      <span class="fic" style="color:${m.color}">${icon(m.icon,16)}</span>
      <div class="ft js-pin-open" data-mkey="${m.key}" data-id="${x.id}"><div class="fn ${(m.type==='todo'&&todoDone(x))?'done':''}">${esc(x.title)}</div><div class="fm">${sub(m,x)}</div></div>
      ${ctl(m,x)}</div>`).join("")
    : `<div class="focus-empty">在任意模块点击 <span style="display:inline-flex;color:var(--module-3);vertical-align:-2px">${icon("star",13)}</span> 即可把要事置顶到这里。</div>`;
  return `<div class="tile"><div class="tile-h"><span class="tic">${icon("star",16)}</span><div class="tt"><span class="en">TODAY'S FOCUS</span><span class="zh">今日聚焦</span></div><span class="r">${pins.length} 项</span></div>

}

    return `<div class="ring" data-open="${o.key}"><div class="dial">${ringSVG(r.value,o.color)}<span class="mid" style="color:${o.color}">${icon(o.icon,26)}</span></div>

  if(visKeys.includes("todo")){ const left=(data.todo||[]).filter(x=>todoApplies(x,today())&&!todoDone(x)).length; stats.push(`<div class="ov2-stat" data-open="todo"><span class="s-ic" style="color:var(--module-3)">${icon("list",17)}</span><div class="s-tx"><div class="s-v">${left}</div><div class="s-l">待办未完成</div></div></div>`); }

  const recCount=vm.filter(m=>m.type!=="reader").reduce((s,m)=>s+((data[m.key]||[]).length),0);

  return `<div class="tile"><div class="tile-h"><span class="tic">${icon("target",16)}</span><div class="tt"><span class="en">DAILY VITALS</span><span class="zh">今日概览</span></div><span class="r">${dateStr()}</span></div>

    </div></div>`;
}

const STATUS_REASONS=["睡眠","工作","家庭","身体","情绪","其他"];
function statusToday(){ data.__status=data.__status||{}; return data.__status[today()]||null; }
function statusTileHTML(){

/* 最近 7 天的状态历史（__status 本来就按日期存着，这里只是把它显出来） */
let stSelISO=null;   // 最近 7 天中选中的日期（选中查看，不再用悬停）
function statusDetailOf(rec){
  const m=MOODS.find(x=>x.k===rec.mood);
  const parts=[];
  if(m) parts.push(m.label);
  if(rec.reason) parts.push(rec.reason);
  if(rec.note) parts.push(rec.note);
  return parts.length? parts.join(" · ") : "已记录";
}
function statusHistHTML(){
  const st=data.__status||{};
  const cOf=k=>{ const m=MOODS.find(x=>x.k===k); return m?m.c:""; };
  let dots="";
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i);
    const iso=d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
    const rec=st[iso];
    dots+=`<span class="sthd${i===0?" now":""}${stSelISO===iso?" sel":""}" data-iso="${iso}" style="${rec?`background:${cOf(rec.mood)};border-color:${cOf(rec.mood)}`:""}"></span>`;
  }
  const tip = stSelISO
    ? `${stSelISO.slice(5).replace("-","/")} ${st[stSelISO]?statusDetailOf(st[stSelISO]):"没记录"}`
    : "";
  return `<div class="sthist"><span class="lh">最近 7 天</span>${dots}<span class="lh sthd-tip">${tip}</span></div>`;
}
function bindStHist(w){ w.querySelectorAll(".sthd").forEach(el=>el.onclick=()=>toggleStatusSel(el.dataset.iso)); }
function toggleStatusSel(iso){
  stSelISO = (stSelISO===iso)? null : iso;
  document.querySelectorAll(".sthist").forEach(w=>{ w.innerHTML=statusHistHTML(); bindStHist(w); });
}
function setStatusMood(k){ data.__status=data.__status||{}; const t=today(); const cur=data.__status[t];
  if(cur && cur.mood===k) delete data.__status[t];          // 再点同一个 = 取消
  else data.__status[t]={ mood:k, reason:(cur&&cur.reason)||"", note:(cur&&cur.note)||"" };
  persist(); }
function setStatusReason(r){ const t=today(); const cur=data.__status[t]; if(!cur) return; cur.reason=(cur.reason===r?"":r); persist(); }
function setStatusNote(v){ const t=today(); const cur=data.__status[t];
  if(cur) cur.note=v.trim(); else data.__status[t]={ mood:"", reason:"", note:v.trim() }; store.save(); }

/* ---------- 方向推进：每条方向最近一次推进（不打卡、不积分，只做一个“最近有没有动”的提示） ---------- */
const MOMENTUM_STALE_DAYS=5;      // 超过这么多天没有推进，就把“最近推进”标黄提醒
/* 方向下面所有「执行任务」里，最近一次被完成的那天 */
function dirLastTouch(node){ let last="";
  const walk=n=>{ (n.children||[]).forEach(k=>{ if(k.lv==="week") weekTasks(k).forEach(t=>{ if(t.done&&t.date&&t.date>last) last=t.date; }); walk(k); }); };
  walk(node); return last;
}
function daysAgo(iso){ if(!iso) return null; const a=new Date(iso+"T00:00:00"), b=new Date(isoToday()+"T00:00:00"); return Math.max(0,Math.round((b-a)/86400000)); }
function momentRecent(last){ if(!last) return { text:"还没推进", stale:false };
  const ago=daysAgo(last), stale=ago>=MOMENTUM_STALE_DAYS;
  return { text:(ago===0?"今天":ago===1?"昨天":ago+" 天前")+(stale?" ⚠️":""), stale };
}
function momentumTileHTML(){
  if(!visibleModules().some(m=>m.key==="goal")) return "";
  const dirs=(data.goal||[]).filter(n=>!n.archived);
  const info=dirs.map(n=>{ const last=dirLastTouch(n); return { n, pct:nodePct(n), rec:momentRecent(last) }; });
  const staleN=info.filter(x=>x.rec.stale).length;
  const rows=info.length?info.map(({n,pct,rec})=>`<div class="mom-row" data-open="goal">
      <span class="mom-ic" style="color:var(--module-2)">${icon("compass",17)}</span>
      <div class="mom-main">
        <div class="mom-top"><span class="mom-name">${esc(n.title)}</span><span class="mom-recent ${rec.stale?'stale':''}">${esc(rec.text)}</span></div>
        <div class="mom-meta">${n.stage?`当前阶段：${esc(n.stage)}`:'<span class="dim">还没写当前阶段</span>'}${n.week?`&nbsp;·&nbsp;近期推进：${esc(n.week)}`:''}</div>
      </div>
      <div class="mom-prog"><div class="mom-track"><i style="width:${pct}%;background:var(--module-2)"></i></div><span class="mom-pct">${pct}%</span></div>
    </div>`).join("")
    :`<div class="mom-empty">还没有方向。去「目标拆解」先定 1–3 个你真正想推进的方向。</div>`;
  return `<div class="tile"><div class="tile-h"><span class="tic">${icon("compass",16)}</span>
      <div class="tt"><span class="en">MOMENTUM</span><span class="zh">方向推进</span></div>
      <div class="r" style="display:flex;align-items:center;gap:10px">
        ${staleN?`<span style="color:var(--module-3);font-weight:800">${staleN} 个停滞</span>`:''}
        <span>${dirs.length} 个方向</span>
        <button class="btn ghost" data-open="goal" style="padding:5px 10px;font-size:12px;border-radius:8px;gap:4px">去目标拆解${icon("chevron",13,2.2)}</button>
      </div></div>
    <div class="mom-list">${rows}</div></div>`;
}

/* ---------- 护眼专注（专注 45 / 休息 15，自动循环；按“结束时间戳”计时，
   切走或刷新回来都能接着算。不做番茄钟统计，只帮你看住连续用眼时间） ---------- */
const EYE_DEF={ focus:45, break:15, auto:true, sound:true };
function eyeCfg(){ if(!data.eyeCfg) data.eyeCfg=Object.assign({},EYE_DEF); return data.eyeCfg; }
function eyeState(){ if(!data.eye) data.eye={ phase:"focus", running:false, paused:false, endAt:0, remain:0, round:1 }; return data.eye; }
function eyeDur(phase){ const c=eyeCfg(); return Math.max(1,(phase==="break"?c.break:c.focus))*60000; }
function eyeLeft(){ const st=eyeState();
  if(st.running && !st.paused) return Math.max(0,st.endAt-Date.now());
  if(st.paused) return Math.max(0,st.remain||0);
  return eyeDur(st.phase); }
function fmtMS(ms){ ms=Math.max(0,ms); const s=Math.ceil(ms/1000);

/* 提醒音用浏览器自带的音频合成，不引外部文件；第一次点击时“解锁”，之后切换才响得出来 */
let eyeAudio=null;
function eyePrimeAudio(){ if(!eyeCfg().sound) return;
  try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    eyeAudio=eyeAudio||new AC(); if(eyeAudio.state==="suspended") eyeAudio.resume(); }catch(e){} }
function eyeBeep(double){ if(!eyeCfg().sound) return;
  try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    eyeAudio=eyeAudio||new AC(); if(eyeAudio.state==="suspended") eyeAudio.resume();
    const ctx=eyeAudio; (double?[0,0.30]:[0]).forEach((t,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=i?880:660; o.connect(g); g.connect(ctx.destination);
      const st=ctx.currentTime+t;
      g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.2,st+0.02);

/* 时间到 → 切阶段；自动模式直接开下一段，否则停下等你点继续 */
function eyeTransition(){ const st=eyeState();
  st.phase = st.phase==="focus" ? "break" : "focus";
  if(st.phase==="focus") st.round=(st.round||1)+1;
  const dur=eyeDur(st.phase);
  eyeBeep(st.phase==="break");
  if(eyeCfg().auto){ st.running=true; st.paused=false; st.endAt=Date.now()+dur; }
  else { st.running=false; st.paused=false; st.remain=dur; }
  persist();
}
/* 常驻的秒表：不管你切到哪个板块都在走，只更新这一个小块，不动其它页面 */
function eyeTick(){ const st=eyeState();
  if(st.running && !st.paused && Date.now()>=st.endAt) eyeTransition();
  eyePaint();
}
let eyeTimer=null;
function eyeEnsureTimer(){ if(!eyeTimer) eyeTimer=setInterval(eyeTick,500); }
function eyeMain(){ const st=eyeState();
  eyePrimeAudio();
  if(st.running && !st.paused){ st.paused=true; st.remain=Math.max(0,st.endAt-Date.now()); }
  else if(st.paused){ st.paused=false; st.running=true; st.endAt=Date.now()+(st.remain||eyeDur(st.phase)); }
  else { st.running=true; st.paused=false; st.endAt=Date.now()+(st.remain>0?st.remain:eyeDur(st.phase)); }
  persist(); eyePaint();
}
function eyeStop(){ const st=eyeState();
  st.running=false; st.paused=false; st.endAt=0; st.remain=0; st.phase="focus"; st.round=1; persist(); eyePaint(); }

  const st=eyeState(), cfg=eyeCfg(); if(!document.getElementById("eye-tile")) return;

/* ---------- 首页日历（月视图，纯信息展示，不做打卡/连续天数） ---------- */
function daysWithItems(){
  // 返回 { "2026-10-19": { todo:[{id,title,done,priority}], idea:[...], review:[...] }, ... }
  const map={};
  visibleModules().forEach(m=>{ if(m.type==="reader"||m.type==="goal") return;
    (data[m.key]||[]).forEach(x=>{
      const push=dd=>{ if(!dd) return;
        if(!map[dd]) map[dd]={};
        if(!map[dd][m.key]) map[dd][m.key]=[];
        map[dd][m.key].push(x);
      };
      if(m.type==="schedule") schedDates(x).forEach(push);   // 时间段排期：展开到范围内的每一天
      else push(String(x.date||"").slice(0,10));
    });
  });
  return map;
}
function calShift(delta){
  const n=new Date(); const b=calYM||{y:n.getFullYear(),m:n.getMonth()};
  let m=b.m+delta, y=b.y;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }

}

function modSummary(m){
  if(m.type==="todo"){ const it=data[m.key]||[]; return { main:`${it.filter(x=>todoDone(x)).length}/${it.length}`, extra:"已完成" }; }
  if(m.type==="progress"){ const it=data[m.key]||[]; return { main:`${it.length}`, extra:`项 · 平均 ${avgProgress(it).value}%` }; }
  if(m.type==="goal"){ const it=data[m.key]||[]; return { main:`${it.length}`, extra:`个方向 · 平均 ${goalAvg(it).value}%` }; }

}
/* ---------- AI 复盘（第一档：不联网。把本周数据按固定问题拼好，一键复制去问任意 AI） ---------- */
function weekRange(){ const n=new Date(); const dow=(n.getDay()+6)%7;
  const mon=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow);
  const iso=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  return { start:iso(mon), end:isoToday() }; }
function inWeek(d){ const r=weekRange(); return !!d && d>=r.start && d<=r.end; }
const AI_MOOD_TXT={ good:"🟢 很好", ok:"🟡 一般", low:"🔴 低能量" };
function buildWeeklyDigest(){
  const r=weekRange(), vm=visibleModules(), vk=vm.map(m=>m.key), L=[];
  L.push("请基于我下面这一周的真实数据做一次复盘，按这五个问题回答：");
  L.push("1) 本周真正推进了什么");
  L.push("2) 哪些事情没有完成");
  L.push("3) 可能卡在哪里");
  L.push("4) 值得保留的做法");
  L.push("5) 下周可以推进什么");
  L.push("要求：只分析数据里能看到的事实，不要替我安排人生，语气平实，少说空话；某部分数据是空的就说明没记录，不要猜。");
  L.push("");
  L.push(`—— 以下是我 ${r.start}（周一）到 ${r.end}（今天）的数据 ——`);
  /* 今日计划 */
  /* 周报是回顾过去一周：已完成任务即使后来被移出今日计划（sched=false）也属于历史成果，
     所以这里不过滤 sched；未安排的任务没有完成日期，天然不会进「未完成」段 */
  if(vk.includes("todo")){
    const ts=(data.todo||[]), done=ts.filter(x=>x.done&&inWeek(x.date)), undone=ts.filter(x=>!x.done&&x.date&&x.date<=r.end);
    L.push(""); L.push(`【今日计划】本周完成 ${done.length} 项`);
    done.forEach(x=>L.push(`- ✅ ${x.title}（${x.group||"其他"} · ${x.date}）`));
    if(!done.length) L.push("- （本周没有已完成记录）");
    L.push(`【未完成】${undone.length} 项（含之前遗留）`);
    undone.forEach(x=>L.push(`- ⬜ ${x.title}（${x.group||"其他"} · 计划 ${x.date}）`));
    if(!undone.length) L.push("- （没有没做的，很干净）");
  }
  /* 目标拆解：方向 → 每个方向下挂了任务的节点（任意层级） */
  if(vk.includes("goal")){
    L.push(""); L.push(`【目标拆解】共 ${(data.goal||[]).length} 个方向`);
    (data.goal||[]).forEach(d=>{
      const rec=momentRecent(dirLastTouch(d));
      L.push(`- 方向「${d.title}」进度 ${nodePct(d)}% · 最近推进：${rec.text}`);
      if(d.stage) L.push(`  当前阶段：${d.stage}`);
      if(d.week) L.push(`  近期推进：${d.week}`);
      const walk=(n,path)=>{ (n.children||[]).forEach(k=>{
        const ts=tasksOf(k);
        if(ts.length){
          /* 与目标进度同口径：一次性算完成数，循环按本周应打卡/已打卡（无排期的不算） */
          const one=ts.filter(t=>!isRepeat(t));
          const ws=ts.filter(t=>isRepeat(t)).map(t=>repWeekStat(t)).filter(s=>s.total>0);
          const rDone=ws.reduce((a,s)=>a+s.done,0), rTotal=ws.reduce((a,s)=>a+s.total,0);
          const bits=[];
          if(one.length) bits.push(`一次性 ${one.filter(t=>t.done).length}/${one.length}`);
          if(rTotal) bits.push(`循环打卡 ${rDone}/${rTotal}`);
          L.push(`  · 目标「${k.title}」（${path.concat([k.title]).join(" / ")}）：${bits.length?bits.join(" · "):"本周无可统计排期"}`);
        }
        walk(k,path.concat([k.title])); }); };
      walk(d,[d.title]);
    });
  }
  /* 工作复盘 */
  if(vk.includes("review")){
    const rv=(data.review||[]).filter(x=>inWeek(x.date));
    L.push(""); L.push(`【工作复盘】本周新增 ${rv.length} 条`);
    rv.forEach(x=>L.push(`- [${x.mood||"记录"}] ${x.title}${x.content?`：${x.content.slice(0,80)}`:""}`));
    if(!rv.length) L.push("- （本周没写复盘）");
  }
  /* 灵感碎片 */
  if(vk.includes("idea")){
    const ids=(data.idea||[]).filter(x=>inWeek(x.date));
    L.push(""); L.push(`【灵感碎片】本周新增 ${ids.length} 条`);
    ids.forEach(x=>L.push(`- ${x.title}${x.mood?`（${x.mood}）`:""}`));
  }
  /* 每日状态 */
  const st=data.__status||{}, stDays=Object.keys(st).filter(inWeek).sort();
  if(stDays.length){ L.push(""); L.push("【每日状态】");
    stDays.forEach(d=>{ const s=st[d];
      L.push(`- ${d}：${AI_MOOD_TXT[s.mood]||s.mood}${s.reason?`（${s.reason}）`:""}${s.note?` 备注：${s.note}`:""}`); });
  }
  /* 私人记录（私人模式下） */
  if(vk.includes("memo")){
    const ms=(data.memo||[]).filter(x=>inWeek(x.date));
    L.push(""); L.push(`【私人记录】本周新增 ${ms.length} 条`);
    ms.forEach(x=>L.push(`- ${x.title}${x.content?`：${x.content.slice(0,80)}`:""}`));
  }
  return L.join("\n");
}

  overlay.innerHTML=`<div class="modal" style="width:680px"><h3>AI 复盘 · 本周摘要</h3>
    <div class="sub">已按固定问题拼好你本周的数据。点「复制全部」，粘贴给任意 AI 助手（DeepSeek / Kimi / 豆包…）就能生成复盘。文本框内容可以先自己改。</div>

  $("#screen").innerHTML=`<div class="header"><div><h2>${m.name}</h2><p>${m.desc}</p></div><div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    <div class="toolbar">
      <div class="search-box">${icon("search",15,2.2)}<input id="search" placeholder="搜索…" value="${attr(searchQ)}"/></div>
      <div class="spacer"></div>${clearBtn}<button class="btn" id="btn-new">${icon("plus",16,2.2)}新建</button></div>
    ${tabs}
    ${head}
    <div class="mod-layout">
      <div class="mod-main">
        <div class="sec-title">全部记录 <span id="rec-count" style="margin-left:auto;font-weight:500;color:var(--text-secondary);font-size:12px">${it.length} 条</span></div>
        <div class="rec-grid">${body}</div>
      </div>
      <aside class="mod-side">${m.type==="todo"?eyeTileHTML(true):""}${sideStats(m, m.type==="todo"?plan:all)}</aside>
    </div>`;
  const s=$("#search");
  let composing=false;
  const refresh=()=>{ searchQ=s.value; renderModuleResults(key); };
  s.addEventListener("compositionstart",()=>{ composing=true; });
  s.addEventListener("compositionend",()=>{ composing=false; refresh(); });
  s.addEventListener("input",()=>{ if(!composing) refresh(); });
  $("#screen").querySelectorAll(".tabbar .tab").forEach(el=>el.onclick=()=>{ todoGroup=el.dataset.g; renderModule(key); });
  const cb=$("#btn-clear"); if(cb) cb.onclick=()=>{
    const nT=plan.filter(clearTmp).length, nL=plan.filter(clearLink).length;
    let sub=`会把 ${nT} 条已完成的临时任务删掉，删了找不回来`;
    if(nL) sub+=`；${nL} 条关联目标的执行任务只移出今日计划，目标树里的任务和完成记录保留`;
    askConfirm("清理已完成", sub+"（循环计划不在清理范围内）。", "清理", ()=>{
      data[key]=data[key].filter(x=>!clearTmp(x));
      data[key].forEach(x=>{ if(clearLink(x)) x.sched=false; });
      persist();
    });
  };
  $("#btn-new").onclick=()=>openEditor(key,null);
  wireModule(key);
  if(m.type==="todo"){ wireEye(); eyePaint(); }   // 护眼专注嵌在今日计划右侧栏
}

/* 仅刷新受搜索影响的记录列表与计数，不重建搜索框（避免打断中文输入法） */
function renderModuleResults(key){
  const m=modOf(key); const all=data[key]||[];
  const groups=m.groups||[];
  let it=all;
  if(m.type==="todo") it=it.filter(inPlan);   // 今日计划只显示已安排的任务
  if(groups.length && todoGroup!=="全部") it=it.filter(x=>(x.group||"")===todoGroup);
  const q=searchQ.trim().toLowerCase();
  if(q) it=it.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.note||x.content||"").toLowerCase().includes(q));
  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,28)}</span><div>${q||todoGroup!=="全部"?'这个分类下还没有记录':'还没有记录，点右上角「新建」添加第一条吧'}</div></div>`;
  const grid=document.querySelector(".rec-grid"); if(grid) grid.innerHTML=body;
  const cnt=$("#rec-count"); if(cnt) cnt.textContent=`${it.length} 条`;
  wireModule(key);
}

/* 模块统计侧栏：按 type 生成多维数据，填满右侧空间 */
function sideStats(m, all){
  const t=today();
  const palette=["var(--accent)","var(--module-1)","var(--module-2)","var(--module-3)","var(--module-4)","var(--module-5)","var(--danger)"];
  const row=(k,v,dot)=>`<div class="stat-row"><span class="k">${dot?`<span class="kd" style="background:${dot}"></span>`:''}${k}</span><span class="val">${v}</span></div>`;

  if(m.type==="finance"){
    const inc=all.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
    const exp=all.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
    // 支出按分类聚合
    const byCat={}; all.filter(x=>x.type==="expense").forEach(x=>{ const c=x.category||"其他"; byCat[c]=(byCat[c]||0)+ +x.amount; });
    const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const maxC=cats.length?cats[0][1]:1;
    const catBars=cats.length? cats.map((c,i)=>`<div class="cbrow"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxC*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">¥${c[1]}</span></div>`).join("")
      : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无支出记录</div>`;
    const todayExp=all.filter(x=>x.type==="expense"&&x.date===t).reduce((a,x)=>a+ +x.amount,0);
    return `<div class="side-card"><div class="sh">${icon("wallet",15)} 收支概况</div>
        ${row("总收入",`<span style="color:var(--module-1)">¥${inc}</span>`)}
        ${row("总支出",`<span style="color:var(--danger)">¥${exp}</span>`)}
        ${row("净结余",`¥${inc-exp}`)}
        ${row("今日支出",`¥${todayExp}`)}
        ${row("总笔数",`${all.length} 笔`)}</div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 支出分类占比</div><div class="catbar">${catBars}</div></div>`;
  }

  if(m.type==="progress"){
    const p=avgProgress(all);
    const doneN=all.filter(x=>((x.current/x.target)*100||0)>=100).length;
    const totalCur=all.reduce((a,x)=>a+ (+x.current||0),0);
    const totalTgt=all.reduce((a,x)=>a+ (+x.target||0),0);
    return `<div class="side-card"><div class="sh">${icon("target",15)} 总体进度</div>
        <div class="side-ring"><div class="dial">${ringSVG(p.value,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${p.value}%</span><span class="cap">平均进度</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("list",15)} 数据统计</div>
        ${row("进行项目",`${all.length} 项`)}
        ${row("已达成",`${doneN} 项`)}
        ${row("累计完成",`${totalCur} ${all[0]?.unit||m.unit||''}`)}
        ${row("总目标量",`${totalTgt} ${all[0]?.unit||m.unit||''}`)}</div>`;
  }

  if(m.type==="checkin"){
    const done=all.filter(x=>x.log&&x.log[t]).length; const pct=all.length?Math.round(done/all.length*100):0;
    const streaks=all.map(x=>({title:x.title,s:streak(x.log)})).sort((a,b)=>b.s-a.s);
    const best=streaks[0]?streaks[0].s:0;
    const list=streaks.slice(0,6).map(x=>`<div class="stat-row"><span class="k">${esc(x.title)}</span><span class="val" style="color:var(--module-3)">${x.s} 天</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("leaf",15)} 今日打卡</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${done}/${all.length}</span><span class="cap">已完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("flame",15)} 连续天数</div>
        ${row("最长连续",`<span style="color:var(--module-3)">${best} 天</span>`)}
        ${row("习惯总数",`${all.length} 个`)}
        <div style="margin-top:6px">${list}</div></div>`;
  }

  if(m.type==="todo"){
    const done=all.filter(x=>todoDone(x)).length; const pct=all.length?Math.round(done/all.length*100):0;
    const byP={}; (m.priorities||[]).forEach(p=>byP[p.key]=0); all.forEach(x=>{ if(byP[x.priority]!=null) byP[x.priority]++; });
    const pRows=(m.priorities||[]).map(p=>`<div class="stat-row"><span class="k"><span class="kd" style="background:${p.text}"></span>${p.label}</span><span class="val">${byP[p.key]||0} 项</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("list",15)} 完成情况</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${pct}%</span><span class="cap">${done}/${all.length} 完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 优先级分布</div>
        ${pRows}
        ${row("剩余待办",`${all.length-done} 项`)}</div>`;
  }

  // note
  const todayN=all.filter(x=>x.date===t).length;
  const byMood={}; all.forEach(x=>{ const md=x.mood||"未分类"; byMood[md]=(byMood[md]||0)+1; });
  const moods=Object.entries(byMood).sort((a,b)=>b[1]-a[1]);
  const maxM=moods.length?moods[0][1]:1;
  const moodBars=moods.length? moods.map((c,i)=>`<div class="cbrow"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxM*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">${c[1]} 条</span></div>`).join("")
    : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无记录</div>`;
  return `<div class="side-card"><div class="sh">${icon("pen",15)} 记录统计</div>
      ${row("累计记录",`${all.length} 条`)}
      ${row("今日新增",`${todayN} 条`)}
      ${row("标签种类",`${moods.length} 种`)}</div>
    <div class="side-card"><div class="sh">${icon("chart",15)} 标签分布</div><div class="catbar">${moodBars}</div></div>`;
}

/* per-module hero header: icon + big number + label */
function headHero(m, big, label){
  const inner=`<div class="hero-ic" style="background:${m.tint};color:${m.color}">${icon(m.icon,24)}</div>
    <div class="hero-tx"><div class="hero-row"><span class="hero-v">${big}</span><span class="hero-l">${label}</span></div></div>`;
  if(m.cover) return `<div class="hero has-cover"><div class="hero-bg" style="background-image:url('${attr(m.cover)}')"></div><div class="hero-inner">${inner}</div></div>`;
  return `<div class="hero">${inner}</div>`;
}

function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  // 移出与删除分离：关联目标的执行任务在今日计划里只提供「移出今日计划」，不物理删除
  const del=(m.type==="todo"&&x.goalId)
    ? `<button class="del js-unsched" data-id="${x.id}" title="移出今日计划（任务保留在目标树）">${icon("calendar",15)}</button>`
    : `<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",15)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`;
  const chkMark=icon("check",13,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';
  const customMeta=(m.fields||[]).filter(f=>x[f.key]&&f.type!=="goalref").map(f=>`<span class="meta-tag">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';
  const layout=x.layout||'default';
  // 大图模式没图片时回退为标准布局
  const effLayout=(layout==='feature'&&!x.image)?'default':layout;
  const layoutCls=`rec-layout-${effLayout}`;

  // feature layout: 大图在上 + 标题 + 正文在下 (适合有图记录)
  if(effLayout==='feature' && x.image){
    const body=(x.content||x.note||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}">
      ${thumb}
      <div class="feat-title">${esc(x.title||'无标题')}</div>
      ${body?`<div class="feat-body">${esc(body)}</div>`:''}
      ${customBlock?`<div style="padding:0 16px 14px">${customBlock}</div>`:''}</div></div>`;
  }
  // quote layout: 大字居中 (适合短文本/灵感/金句)
  if(effLayout==='quote'){
    const text=(x.content||x.title||'').trim();
    const qOn = m.type==="todo" ? todoDone(x) : !!x.done;
    const chk=(m.type==="todo"||m.type==="checkin")?`<div class="chk js-chk ${qOn?'on':''}" data-id="${x.id}" style="margin-bottom:10px">${chkMark}</div>`:'';
    const p=m.type==="todo"?(m.priorities||[]).find(p=>p.key===x.priority):null;
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center">
      ${chk}
      <div class="quote-text ${qOn?'done':''}">${esc(text)}</div>
      ${p?`<span class="badge" style="background:${p.color};color:${p.text};margin-top:8px"><span class="dot"></span>${p.label}</span>`:''}
      ${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}
      ${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}</div></div>`;
  }

  // default layout
  if(m.type==="todo"){ const p=(m.priorities||[]).find(p=>p.key===x.priority);
    const gp=x.goalId?goalIndex()[x.goalId]:null;
    const gpath=gp?gp.path.join(" / "):"";
    const on=todoDone(x);
    const st=isRepeat(x)?repWeekStat(x):null;
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px"><div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><span class="rname ${on?'done':''}">${esc(x.title)}</span>
      ${isRepeat(x)?`<span class="badge repb" title="循环计划：打卡只记录当天，不计入目标进度">${esc(repText(x))}${st&&st.total?` · 本周 ${st.done}/${st.total}`:''}</span>`:''}
      ${(!gpath&&!isRepeat(x))?`<span class="badge tmpb" title="临时计划：没有关联目标、也不循环，勾选即为完成">临时</span>`:''}
      ${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}
      ${gpath?`<span class="badge" style="background:var(--surface-nested);color:var(--module-2)" title="所属目标">${icon("compass",12,2.2)}${esc(gpath)}</span>`:''}
      ${x.note?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary)">${esc(x.note).slice(0,40)}</span>`:''}${customBlock}</div></div></div>`; }
  if(m.type==="checkin"){ const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px"><div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><span class="rname">${esc(x.title)}</span>
      <span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}${customBlock}</div></div></div>`; }
  if(m.type==="progress"){ const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname">${esc(x.title)}</span>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      <span class="rdate" style="margin-left:0;color:var(--text-secondary)">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div>
      <div class="step-box"><button class="step-btn js-dec" data-id="${x.id}" title="减 1">${icon("minus",14,2.4)}</button>
      <button class="step-btn js-inc" data-id="${x.id}" title="加 1">${icon("plus",14,2.4)}</button></div></div></div>`; }
  if(m.type==="finance"){ const inc=x.type==="income";
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname">${esc(x.title)}</span>
      <span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span>
      <span class="rdate">${x.date||''}</span>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}">${inc?'+':'-'}¥${x.amount}</div></div></div>`; }
  if(m.type==="schedule"){ const gc=GRP_COLOR[x.group]||"var(--module-2)";
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname ${x.done?'done':''}">${esc(x.title)}</span>
      <span class="badge" style="background:${gc};color:var(--on-accent)">${esc(x.group||'其他')}</span>
      ${x.note?`<span class="rdate" style="margin-left:0;color:var(--text-secondary)">${esc(x.note).slice(0,40)}</span>`:''}
      <span class="rdate">${schRangeText(x)}</span>${customBlock}</div>
      <div class="sch-chk js-chk ${x.done?'on':''}" data-id="${x.id}" title="${x.done?'标记为未完成':'标记为已完成'}" style="color:${gc};border-color:${gc}">${x.done?icon("check",13,2.4):''}</div></div></div>`; }
  // note
  return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
    <span class="rname">${esc(x.title||'无标题')}</span>
    ${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}
    ${x.content?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary)">${esc(x.content).slice(0,40)}</span>`:''}
    <span class="rdate">${x.date||''}</span>${customBlock}</div></div></div>`;
}

function streak(log){ if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const k=d.toISOString().slice(0,10); if(log[k]){ n++; d.setDate(d.getDate()-1);} else break; } return n; }

function wireModule(key){ const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo"){ todoToggle(x); }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    else if(m.type==="schedule"){ x.done=!x.done; }
    persist(); });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  // 移出今日计划：只取消安排（sched=false），不删除任务、不动完成状态
  $("#screen").querySelectorAll(".js-unsched").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const x=(data[key]).find(i=>i.id==el.dataset.id); if(!x) return;
    x.sched=false; persist(); toast("已移出今日计划（任务保留在目标树）"); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  // 长期计划：+1 / -1
  $("#screen").querySelectorAll(".js-inc").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const x=(data[key]).find(i=>i.id==el.dataset.id); if(!x) return; x.current=(+x.current||0)+1; persist(); });
  $("#screen").querySelectorAll(".js-dec").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const x=(data[key]).find(i=>i.id==el.dataset.id); if(!x) return; x.current=Math.max(0,(+x.current||0)-1); persist(); });
}

/* ---------- EDITOR MODAL (per type) ---------- */
function openEditor(key,item,opts){
  const m=modOf(key); const editing=!!item && !(opts&&opts.isNew); const d=item||newItem(m);
  let fields=""; let rep=null;
  if(m.type==="todo"){
    rep=d.repeat?{kind:d.repeat.kind||"none",days:(d.repeat.days||[]).slice(),until:d.repeat.until||"",paused:!!d.repeat.paused,start:d.repeat.start||today()}:
                 {kind:"none",days:[1,2,3,4,5],until:"",paused:false,start:today()};
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>
      <div class="field"><label>循环</label><div class="seg" id="f-rep">
        <div class="opt ${rep.kind==='none'?'on':''}" data-v="none">不循环</div>
        <div class="opt ${rep.kind==='daily'?'on':''}" data-v="daily">每天</div>
        <div class="opt ${rep.kind==='weekday'?'on':''}" data-v="weekday">工作日</div>
        <div class="opt ${rep.kind==='custom'?'on':''}" data-v="custom">自定义</div></div></div>
      <div id="f-repwrap"></div>
      ${(!editing&&d.sched===false)?`<div class="gm">这条任务默认只挂在目标树里，不会进入今日计划；需要执行时在目标树任务行点日历图标「安排到今日计划」。</div>`:''}`;
  } else if(m.type==="checkin"){
    fields=`<div class="field"><label>打卡项</label><input id="f-title" value="${attr(d.title)}" placeholder="例如：喝够 8 杯水"/></div>
      <p class="sub" style="margin:0">保存后可在卡片点击左侧方块打卡；连续天数自动统计，每天从零开始。</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div><div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto;min-width:auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else if(m.type==="schedule"){
    const from=d.from||d.date||isoToday();
    const to=d.to||from;
    fields=`<div class="field"><label>排期</label><input id="f-title" value="${attr(d.title)}" placeholder="安排什么？"/></div>
      <div class="field"><label>分类</label><div class="seg" id="f-group">${(m.groups||GRP_ORDER).map(g=>`<div class="opt ${g===d.group?'on':''}" data-v="${attr(g)}" style="flex:0 0 auto;min-width:auto">${esc(g)}</div>`).join("")}</div></div>
      <div class="field"><label>开始日期</label><input id="f-from" type="date" value="${from}"/></div>
      <div class="field"><label>结束日期</label><input id="f-to" type="date" value="${to}"/></div>`;
  } else {
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto;min-width:auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }
  // layout variant selector（排期不需要卡片样式，保持只有名称/分类/起止日期）
  const layoutOpts=[{v:'default',l:'标准'},{v:'feature',l:'大图'},{v:'quote',l:'引文'}];
  if(m.type!=="schedule") fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout">${layoutOpts.map(o=>`<div class="opt ${o.v===(d.layout||'default')?'on':''}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`+fields;
  // custom fields (from m.fields config) — rendered after type-specific fields
  let goalRef=null;
  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="goalref"){
      const chain=goalChainOf(v);
      const curDir=chain.length?String(chain[0].id):"";
      const dirs=(data.goal||[]).filter(n=>!n.archived);
      goalRef={ key:f.key, allWeeks:weekOptions(), curDir, curV:v };
      fields+=`<div class="field"><label>关联方向（可选）</label><div class="seg" id="f-cf-direction">`+
        `<div class="opt ${curDir?'':'on'}" data-v="" style="flex:0 0 auto;min-width:auto">不选方向</div>`+
        (dirs.length?dirs.map(n=>`<div class="opt ${curDir===String(n.id)?'on':''}" data-v="${n.id}" style="flex:0 0 auto;min-width:auto">${esc(n.title||"未命名")}</div>`).join("")
          :`<span style="font-size:12px;color:var(--text-tertiary);align-self:center">还没有方向，先去「目标拆解」建一个</span>`)+
        `</div></div>`;
      fields+=`<div class="field"><label>${esc(f.label)}（可选）</label><div class="seg" id="f-cf-${f.key}"></div></div>`;
    }
    else if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto;min-width:auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  // shared image URL field (all types except schedule)
  if(m.type!=="schedule") fields+=`<div class="field"><label>图片 URL（可选）</label><input id="f-image" value="${attr(d.image||'')}" placeholder="https://..."/></div>`;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><h3>${editing?'编辑':'新建'} · ${m.name}</h3><div class="sub">${m.desc}</div>${fields}
    <div class="modal-actions">${editing?`<button class="link-danger" id="m-del">${(m.type==="todo"&&d.goalId&&!(opts&&opts.gsrc))?"移出今日计划":"删除"}</button>`:''}<div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on"); }));
  /* 今日计划：先选方向 → 可关联目标按方向过滤（任意层级都能关联）；关联只写 goalId，不影响 sched（是否进今日计划） */
  if(goalRef){
    const dirSeg=overlay.querySelector("#f-cf-direction");
    const weekSeg=overlay.querySelector("#f-cf-"+goalRef.key);
    const bindSeg=seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
      seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on"); });
    const renderWeeks=(dirId,sel)=>{
      const list=goalRef.allWeeks.filter(o=>!dirId||String(o.dirId)===String(dirId));
      weekSeg.innerHTML=`<div class="opt ${sel?'':'on'}" data-v="" style="flex:0 0 auto;min-width:auto">不关联</div>`+
        (list.length?list.map(o=>`<div class="opt ${String(o.id)===String(sel)?'on':''}" data-v="${o.id}" title="${attr(o.label)}" style="flex:0 0 auto;min-width:auto">${esc(dirId?o.short:o.label)}</div>`).join("")
          :`<span style="font-size:12px;color:var(--text-tertiary);align-self:center">该方向下还没有可关联的目标</span>`);
      bindSeg(weekSeg);
    };
    renderWeeks(goalRef.curDir, goalRef.curV);
    if(dirSeg){
      bindSeg(dirSeg);
      dirSeg.querySelectorAll(".opt").forEach(o=>o.addEventListener("click",()=>renderWeeks(o.dataset.v,"")));
    }
  }
  /* 今日计划：循环规则（单条记录，打卡写入 doneOn，不生成每日副本） */
  if(m.type==="todo"&&rep){
    const repaint=()=>{
      const w=overlay.querySelector("#f-repwrap"); if(!w) return;
      const curU=w.querySelector("#f-repuntil"); if(curU) rep.until=curU.value;      // 切换规则时保留已填的结束日期
      const curP=w.querySelector("#f-reppause .on"); if(curP) rep.paused=curP.dataset.v==="1";
      let h="";
      if(rep.kind==="none"){
        h=`<div class="gm">不循环：作为一次性任务，勾选即完成。</div>`;
      } else {
        if(rep.kind==="custom"){
          h+=`<div class="field"><label>重复日</label><div class="rep-days">${[1,2,3,4,5,6,0].map(k=>`<div class="rday ${(rep.days||[]).includes(k)?'on':''}" data-repday="${k}">${REP_SHORT[k]}</div>`).join("")}</div></div>`;
        } else {
          h+=`<div class="gm">${rep.kind==="daily"?"每天":"工作日（周一至周五）"}生成当日待办；打卡只记录当天。</div>`;
        }
        h+=`<div class="field"><label>结束日期（可选）</label><input id="f-repuntil" type="date" value="${rep.until||''}"/></div>`;
        if(d.repeat&&isRepeat(d)){
          h+=`<div class="field"><label>状态</label><div class="seg" id="f-reppause">
            <div class="opt ${rep.paused?'':'on'}" data-v="0">进行中</div>
            <div class="opt ${rep.paused?'on':''}" data-v="1">暂停</div></div></div>`;
        }
        h+=`<div class="gmhint">暂停 / 结束只影响之后的安排，已打卡的日期不会变。循环打卡按本周完成率计入目标进度。</div>`;
      }
      w.innerHTML=h;
      w.querySelectorAll("[data-repday]").forEach(el=>el.onclick=()=>{
        const k=+el.dataset.repday, i=rep.days.indexOf(k);
        if(i>=0) rep.days.splice(i,1); else rep.days.push(k);
        el.classList.toggle("on"); });
      const pz=w.querySelector("#f-reppause");
      if(pz) pz.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
        pz.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
        rep.paused=o.dataset.v==="1"; });
    };
    overlay.querySelector("#f-rep").querySelectorAll(".opt").forEach(o=>o.addEventListener("click",()=>{ rep.kind=o.dataset.v; repaint(); }));
    repaint();
  }
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close();
    // 关联目标的任务从今日计划侧打开时，只移出不删除；真删除走目标树编辑器（gsrc 标记）
    if(m.type==="todo"&&d.goalId&&!(opts&&opts.gsrc)){
      d.sched=false; persist(); toast("已移出今日计划（任务保留在目标树）");
      if(opts&&opts.dpop) openDayPopover(opts.dpop); return; }
    confirmDelete(key,d.id, (opts&&opts.dpop)?()=>openDayPopover(opts.dpop):null); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    const rawTitle=(val("#f-title")||"").trim();
    if(m.type==="todo" && !rawTitle){ toast("先写个任务名称"); return; }  // 今日计划不允许空标题
    d.title=rawTitle||"未命名";
    if(m.type!=="schedule") d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim();
      const wasRep=isRepeat(d), doneToday=repDone(d,today());
      const rk=seg("#f-rep")||"none";
      if(rk==="none"){
        if(wasRep) d.done=doneToday;                  // 关闭循环：把今天的打卡状态转成一次性完成状态
        if(d.repeat) d.repeat={...d.repeat,kind:"none"};   // 规则与 doneOn 历史都保留，不删数据
      } else {
        const days=(rep.days||[]).map(Number).sort(function(a,b){return a-b;});
        if(rk==="custom"&&!days.length){ toast("自定义循环至少选一天"); return; }
        rep.until=(val("#f-repuntil")||"").trim();
        const pz=seg("#f-reppause"); if(pz!=null) rep.paused=pz==="1";
        d.repeat={kind:rk,days,until:rep.until,paused:!!rep.paused,start:(d.repeat&&d.repeat.start)||today()};
        if(!Array.isArray(d.doneOn)) d.doneOn=[];
        if(d.done){ d.doneOn=d.doneOn.concat([d.date||today()]).filter((v,i,a)=>a.indexOf(v)===i); d.done=false; }  // 旧的完成记录转进 doneOn，不丢历史
      }
    }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="schedule"){ d.group=seg("#f-group")||"工作";
      let f=(val("#f-from")||"").trim()||isoToday(), t=(val("#f-to")||"").trim()||f;
      if(f>t){ const tmp=f; f=t; t=tmp; }   // 起止倒置时自动纠正
      d.from=f; d.to=t; }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="goalref"){ const g=seg("#f-cf-"+f.key); d[f.key]=(g==null)?(d[f.key]||""):(g===""?"":+g); }   // 选项里没有当前值（如已归档）时保留原关联
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image（排期没有这个字段，不能清掉旧值）
    if(m.type!=="schedule") d.image=(val("#f-image")||"").trim();
    // 新增任务关联到目标时，记录上级进度：若分母变化导致比例下降，保存后说明原因
    let pctWatch=null;
    if(!editing && m.type==="todo" && d.goalId && !isRepeat(d)){
      const e=goalIndex()[d.goalId];
      if(e&&e.parentNode) pctWatch={ p:e.parentNode, before:nodePct(e.parentNode) };
    }
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
    if(opts&&opts.dpop) openDayPopover(opts.dpop);   // 从日历弹窗进来的，保存后回到当天弹窗
    if(pctWatch){ const a=nodePct(pctWatch.p);
      if(a!==pctWatch.before) toast(`新增任务后，上级进度 ${pctWatch.before}% → ${a}%：分母变大，不是已完成成果丢失。`); }
  };
}

function newItem(m){ const base={id:Date.now()}; let item;
  if(m.type==="todo") item={...base,title:"",priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"),done:false,note:""};
  else if(m.type==="checkin") item={...base,title:"",log:{}};
  else if(m.type==="progress") item={...base,title:"",current:0,target:(m.unit==="页"?100:20),unit:m.unit||"",note:""};
  else if(m.type==="finance") item={...base,title:"",type:"expense",amount:"",category:(m.categories&&m.categories[0])||"其他",date:isoToday()};
  else if(m.type==="schedule") item={...base,title:"",group:"工作",from:isoToday(),to:isoToday(),note:"",done:false};
  else item={...base,title:"",content:"",mood:(m.moods&&m.moods[0])||"",date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  // 今日计划：在某个分类页签下新建时，默认选当前分类；「全部」下默认「工作」
  if(m.type==="todo" && todoGroup!=="全部") item.group=todoGroup;
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id,after){ const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:400px"><h3>删除记录</h3><div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); if(after) after(); };
}

/* ---------- 轻提示 / 通用确认 ---------- */
function toast(msg){ const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),2400); }
function askConfirm(title,sub,okLabel,onOk){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:430px"><h3>${esc(title)}</h3><div class="sub">${esc(sub)}</div>
    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="a-cancel">取消</button>
    <button class="btn danger" id="a-ok">${esc(okLabel||"确定")}</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#a-cancel").onclick=close;
  overlay.querySelector("#a-ok").onclick=()=>{ close(); if(onOk) onOk(); };
}

const THEMES=[
  { key:"fog",     name:"晨雾灰",   dot:"#7a9ba8" },
  { key:"almond",  name:"杏仁粉",   dot:"#c49a82" },
  { key:"mint",    name:"薄荷绿",   dot:"#6a9878" },
  { key:"calm",    name:"静谧蓝",   dot:"#5a7a98" },
  { key:"lavender",name:"薰衣草紫", dot:"#8878a8" },
  { key:"dusk",    name:"黄昏橙",   dot:"#c08858" },
  { key:"qingxu",  name:"青序",     dot:"#7fb69b" },
  { key:"qingxu-purple", name:"青序·紫", dot:"#9181c8" },
];
function themeKey(){ const t=data.__theme; return THEMES.some(x=>x.key===t)?t:"fog"; }
function applyTheme(){
  document.documentElement.setAttribute("data-theme", themeKey());
}
function renderThemeBar(){
  const cur=themeKey();
  const bar=$("#themeBar"); if(!bar) return;
  bar.innerHTML=THEMES.map(t=>`<div class="theme-dot ${t.key===cur?'on':''}" data-tk="${t.key}" title="${t.name}" style="background:${t.dot}"></div>`).join("");
  bar.querySelectorAll(".theme-dot").forEach(el=>el.onclick=()=>{
    data.__theme=el.dataset.tk; store.save(); applyTheme(); renderThemeBar();
  });
}

/* ---------- 导出 / 导入 / 同步 ---------- */
const BACKUP_VERSION = 1;                      // 备份文件格式版本（与数据结构版本 SCHEMA_VERSION 分开）
const SNAP_KEY = "workbench-preimport-snapshot-v1";
// 备份涉及的配置项（与 store.save 写入主桶的键保持一致）
const BACKUP_CFG_KEYS = ["__theme","__homeLayout","__owner","__slogan","__mode","__status","eye","eyeCfg","__avatar","__schemaVersion"];

// 只取工作桶数据：私人空间和本地资料（local）都不进备份文件
function workBucketData(){
  const clean={}; Object.keys(data).forEach(k=>{ if(bucketOf(k)==="work") clean[k]=data[k]; });
  return clean;
}
function downloadJSON(obj,name){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
/* 导入前校验：版本不符、结构缺失、记录损坏一律拒绝，绝不用坏文件覆盖现有数据 */
function validateBackup(p){
  if(!p||typeof p!=="object"||Array.isArray(p)) return { ok:false, msg:"文件结构不对，不是一个有效的备份" };
  if(p.app!=="personal-workbench") return { ok:false, msg:"这不是青序导出的备份文件" };
  if(typeof p.version!=="number"||!Number.isFinite(p.version)||p.version%1!==0) return { ok:false, msg:"备份文件缺少可识别的版本号" };
  if(p.version>BACKUP_VERSION) return { ok:false, msg:`备份版本 v${p.version} 比当前应用支持的新，请先升级应用再导入` };
  const d=p.data;
  if(!d||typeof d!=="object"||Array.isArray(d)) return { ok:false, msg:"备份文件里没有数据" };
  const modKeys=CONFIG.modules.map(m=>m.key);
  const keys=Object.keys(d);
  if(!keys.length) return { ok:false, msg:"备份文件是空的，没有可导入的内容" };
  if(!keys.some(k=>modKeys.includes(k))) return { ok:false, msg:"备份文件里没有工作台的数据" };
  for(const k of keys){
    if(modKeys.includes(k)&&!Array.isArray(d[k])) return { ok:false, msg:`备份文件里的「${k}」格式不对` };
    // __ 开头是本应用的内部状态（如 __goalOpen、__status），允许通过；其余未知字段拒绝
    if(!modKeys.includes(k)&&!BACKUP_CFG_KEYS.includes(k)&&!k.startsWith("__")) return { ok:false, msg:`备份文件里含有无法识别的字段「${k}」` };
  }
  for(const k of modKeys){
    if(!Array.isArray(d[k])) continue;
    if(d[k].some(x=>!x||typeof x!=="object"||Array.isArray(x))) return { ok:false, msg:`备份文件里的「${k}」有损坏的记录` };
  }
  const count=modKeys.reduce((s,k)=>s+(Array.isArray(d[k])?d[k].length:0),0);
  return { ok:true, data:d, count };
}
/* 导入前自动快照：本地存一份，同时导出一份文件（两种都失败才会提示风险） */
function savePreImportSnapshot(){
  const now=new Date();
  const payload={ app:"personal-workbench", version:BACKUP_VERSION, kind:"pre-import-snapshot",
    exportedAt:now.toISOString(), data:workBucketData() };
  let stored=false, downloaded=false;
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify(payload)); stored=true; }catch(e){}
  try{ downloadJSON(payload, `导入前快照-${isoToday()}-${pad2(now.getHours())}${pad2(now.getMinutes())}${pad2(now.getSeconds())}.json`); downloaded=true; }catch(e){}
  return { stored, downloaded };
}
function exportData(){
  const payload={ app:"personal-workbench", version:BACKUP_VERSION, exportedAt:new Date().toISOString(), data:workBucketData() };
  const name=`工作台备份-${isoToday()}.json`;
  // Tauri 环境：弹系统「另存为」选路径；浏览器环境：保持 blob 下载
  const core=window.__TAURI__&&window.__TAURI__.core;
  if(core&&typeof core.invoke==="function"){
    let lastDir=""; try{ lastDir=localStorage.getItem("__exportDir")||""; }catch(e){}
    core.invoke("export_backup",{ content:JSON.stringify(payload,null,2), defaultName:name, defaultDir:lastDir })
      .then(p=>{
        if(p){
          try{ localStorage.setItem("__exportDir", p.replace(/[\\/][^\\/]+$/,"")); }catch(e){}
          toast("已导出到 "+p);
        }else{
          toast("已取消导出 · 数据没有变化");
        }
      })
      .catch(err=>toast("导出失败 · "+(err&&err.message?err.message:err)));
    return;
  }
  downloadJSON(payload, name);
  toast("已导出 · 本地资料和私人空间不在备份里");
}
/* 真正写入导入数据：只替换工作桶，私人空间与本地资料保持本机原样 */
function applyImport(d){
  const curPriv={}, curLocal={};
  CONFIG.modules.forEach(m=>{
    if(bucketOf(m.key)==="private") curPriv[m.key]=Array.isArray(data[m.key])?data[m.key]:JSON.parse(JSON.stringify(m.seed||[]));
    if(bucketOf(m.key)==="local")   curLocal[m.key]=Array.isArray(data[m.key])?data[m.key]:JSON.parse(JSON.stringify(m.seed||[]));
  });
  data=d;
  CONFIG.modules.forEach(m=>{
    if(bucketOf(m.key)==="private") data[m.key]=curPriv[m.key];
    else if(bucketOf(m.key)==="local") data[m.key]=curLocal[m.key];
    else if(!Array.isArray(data[m.key])) data[m.key]=JSON.parse(JSON.stringify(m.seed||[]));
  });
  store.save(); applyTheme(); renderThemeBar(); buildNav(); render();
}
function importData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      let p, v;
      try{
        p=JSON.parse(String(r.result));
        v=validateBackup(p);
      }catch(e){ toast("这个文件读不出来，请选导出时生成的那个 json"); return; }
      if(!v.ok){ toast(v.msg); return; }   // 校验不通过：不动现有数据
      let when=""; try{ when=p.exportedAt?new Date(p.exportedAt).toLocaleString():""; }catch(e){}
      askConfirm("导入数据",
        `文件版本 v${p.version}${when?" · 导出于 "+when:""}，共 ${v.count} 条记录。会用文件里的内容覆盖这台设备上的工作数据（本地资料和私人空间都不受影响）。导入前会自动存一份快照。`,
        "覆盖导入",()=>{
          const snap=savePreImportSnapshot();
          applyImport(v.data);
          toast(snap.stored||snap.downloaded
            ? "导入完成 · 导入前的快照已保存" + (snap.downloaded?"并下载":"（仅存于本机）")
            : "导入完成 · 但导入前快照保存失败，请立刻手动导出一次备份");
        });
    };
    r.readAsText(f);
  };
  inp.click();
}
