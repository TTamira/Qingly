<style>
  /* ============================================================
     THEME TOKENS — 一处改色，整站换肤（简约·墨色中性默认）
     ============================================================ */
  :root {
    /* ---- 页面与表面 ---- */
    --page-bg: #f4f3f0;              /* 页面底色（body 背景） */
    --surface-card: #fcfbf8;         /* 卡片/面板/输入框/按钮的主背景 */
    --surface-nested: #f7f6f1;       /* 嵌套区域：图标瓦底、ghost 按钮、hero 底 */

    /* ---- 边框 ---- */
    --border: #ecebe5;               /* 常规边框：卡片、分隔线 */
    --border-input: #e0ded6;         /* 强边框：输入框、按钮、chip、勾选框 */

    /* ---- 文本层级 ---- */
    --text: #232220;                 /* 主文本：标题、正文、数值 */
    --text-secondary: #8f8a80;       /* 次文本：标签、副标题、描述 */
    --text-tertiary: #b6b1a6;        /* 弱文本：图标色、导航字、占位、空态 */

    /* ---- 主色（按钮/选中/强调） ---- */
    --accent: #2f2e2b;               /* 主色·墨石灰：按钮、选中态、section 竖条 */
    --accent-muted: #efeee8;         /* 主色浅底：focus ring 光晕、step 按钮 active 底 */
    --on-accent: #f4f3f0;            /* 主色上的前景文字 */

    /* ---- 模块色（5 色轮转，新模块按序取下一个未用的） ---- */
    --module-1: #6f8f6a;             /* 苔绿 — 打卡/完成/收入 */
    --module-2: #5f7a99;             /* 灰蓝 — 阅读/focus/趋势线 */
    --module-3: #bd8a4e;             /* 赭黄 — 运动/连续天数/星标 */
    --module-4: #b5715a;             /* 陶土 — 记账/占比图 */
    --module-5: #7d7195;             /* 雾紫 — 笔记/日记 */

    /* ---- 危险色 ---- */
    --danger: #c25d4f;               /* 删除/危险操作 */
    --danger-muted: #f6ece9;         /* 危险浅底：删除 hover、P0 标签 */

    /* ---- 抽屉/侧栏（深色面板，中性暖墨，不带红） ---- */
    --drawer-bg: #242423;            /* 侧栏底色 */
    --drawer-bg-top: #2e2e2c;        /* 侧栏渐变上色 */
    --drawer-text: #f4f3f0;          /* 侧栏前景文字 */
    --drawer-text-mute: rgba(244,243,240,.55);  /* 侧栏次要文字/图标 */
    --drawer-hover: rgba(244,243,240,.08);       /* 侧栏悬停底 */
    --drawer-active: rgba(244,243,240,.12);      /* 侧栏选中底 */

    /* ---- 浅色染色面板（问候卡/概览统计位，用 color-mix 自动跟随主题） ---- */

    /* ---- 背景图 ---- */
    --greet-image: url("assets/greet-banner.jpg");  /* 首页 hero 背景图 */
    --page-texture: none;                            /* 页面纹理叠加（保持 none，不做质感材质） */

    /* ---- 圆角（按组件角色，不要裸写数字） ---- */
    --radius-control: 8px;           /* 勾选框、步进按钮、日历格 */
    --radius-tile: 12px;             /* 图标瓦、输入框、按钮、chip */
    --radius-card: 16px;             /* 卡片、面板、hero */
    --radius-sheet: 22px;            /* 弹窗顶部圆角 */

    /* ---- 阴影 ---- */
    --shadow-card: 0 1px 2px rgba(35,34,32,.05), 0 4px 16px color-mix(in srgb, var(--accent) 4%, rgba(35,34,32,.10));   /* 卡片/面板（阴影带轻主题色） */
    --shadow-overlay: 0 8px 24px color-mix(in srgb, var(--accent) 6%, rgba(35,34,32,.16));                              /* 弹窗/toast/悬浮 */

    /* ---- 遮罩 ---- */
    --veil: rgba(35,34,32,.44);      /* 弹窗遮罩：夜间主题会加深 */

    /* ---- 字体与布局 ---- */
    --font: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-num: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "PingFang SC", monospace;  /* 数字专用：统计/金额/日历日期 */

    /* ---- 动效时长（transition 统一收敛于此，量力而行） ---- */
    --t-fast: 120ms;
    --t-med: 200ms;

    --sidebar-w: 258px;              /* 左侧栏宽度 */
    --titlebar-h: 34px;              /* 自绘透明标题栏高度（无边框窗口） */
  }

  /* ============================================================

  html[data-theme="almond"] {

    --border:#ebe0d8; --border-input:#ddd0c6;

  }

  /* 8 · 薄荷绿（自然清新调） */
  html[data-theme="mint"] {
    --page-bg:#f0f5f1; --surface-card:#ffffff; --surface-nested:#e8f0ea;
    --border:#dbe5dd; --border-input:#ced8d0;
    --text:#2a342e; --text-secondary:#7a8a7c; --text-tertiary:#a8b4aa;
    --accent:#6a9878; --accent-muted:#e4f0e6; --on-accent:#ffffff;
    --module-1:#7aaf8e; --module-2:#6a98a8; --module-3:#c8a868; --module-4:#b08878; --module-5:#5a8870;
    --danger:#b86050; --danger-muted:#f5e8e4;
    --drawer-bg:#e8f0ea; --drawer-bg-top:#f0f6f2; --drawer-text:#2a342e;
    --drawer-text-mute:rgba(42,52,46,.55); --drawer-hover:rgba(42,52,46,.06); --drawer-active:rgba(42,52,46,.10);
  }

  /* 9 · 静谧蓝（简约蓝灰调） */
  html[data-theme="calm"] {
    --page-bg:#f0f4f7; --surface-card:#ffffff; --surface-nested:#e8eef4;
    --border:#dbe3ec; --border-input:#cdd5e0;
    --text:#2a3440; --text-secondary:#75808c; --text-tertiary:#a8b2bd;
    --accent:#5a7a98; --accent-muted:#e2ebf4; --on-accent:#ffffff;
    --module-1:#7aaf88; --module-2:#5a7a98; --module-3:#c89868; --module-4:#a088a8; --module-5:#6a8898;
    --danger:#b85a52; --danger-muted:#f5e9e6;
    --drawer-bg:#e8eef4; --drawer-bg-top:#f0f4f9; --drawer-text:#2a3440;
    --drawer-text-mute:rgba(42,52,64,.55); --drawer-hover:rgba(42,52,64,.06); --drawer-active:rgba(42,52,64,.10);
  }

  /* 10 · 薰衣草紫（治愈淡紫调） */
  html[data-theme="lavender"] {
    --page-bg:#f4f2f7; --surface-card:#ffffff; --surface-nested:#eae6f0;
    --border:#e0dce8; --border-input:#d2cce0;
    --text:#342e3e; --text-secondary:#7a708a; --text-tertiary:#aca2b8;
    --accent:#8878a8; --accent-muted:#e8e2f0; --on-accent:#ffffff;
    --module-1:#8aaa88; --module-2:#7a88a8; --module-3:#c89878; --module-4:#b088a8; --module-5:#8878a8;
    --danger:#b85a68; --danger-muted:#f5e9ea;
    --drawer-bg:#eae6f0; --drawer-bg-top:#f2eff5; --drawer-text:#342e3e;
    --drawer-text-mute:rgba(52,46,62,.55); --drawer-hover:rgba(52,46,62,.06); --drawer-active:rgba(52,46,62,.10);
  }

  /* 11 · 黄昏橙（活力暖橙调） */
  html[data-theme="dusk"] {
    --page-bg:#f8f4ee; --surface-card:#ffffff; --surface-nested:#f3ece2;
    --border:#e8ddcd; --border-input:#dccdb8;
    --text:#3e3228; --text-secondary:#8a7a68; --text-tertiary:#b8a898;
    --accent:#c08858; --accent-muted:#f5e8d8; --on-accent:#ffffff;
    --module-1:#8aaa78; --module-2:#c08858; --module-3:#c8a068; --module-4:#b08888; --module-5:#a08878;
    --danger:#b86048; --danger-muted:#f5e8e2;
    --drawer-bg:#f3ece2; --drawer-bg-top:#f8f2e8; --drawer-text:#3e3228;
    --drawer-text-mute:rgba(62,50,40,.55); --drawer-hover:rgba(62,50,40,.06); --drawer-active:rgba(62,50,40,.10);
  }

  /* 12 · 青序（清新青绿调，源自《青序个人仪表盘与配色指南》） */
  html[data-theme="qingxu"] {
    --page-bg:#f5f7f6; --surface-card:#ffffff; --surface-nested:#eaf1ed;
    --border:#e6ece8; --border-input:#d8e0da;
    --text:#4a4a4a; --text-secondary:#9b9b9b; --text-tertiary:#b8bfb9;
    --accent:#7fb69b; --accent-muted:#e4f0ea; --on-accent:#ffffff;
    --module-1:#7fb69b; --module-2:#a9bdd9; --module-3:#e9bfc8; --module-4:#c9b3d8; --module-5:#8fb8d0;
    --danger:#c07870; --danger-muted:#f5e9e8;
    --drawer-bg:#eaf1ed; --drawer-bg-top:#f0f5f2; --drawer-text:#4a4a4a;
    --drawer-text-mute:rgba(74,74,74,.55); --drawer-hover:rgba(74,74,74,.06); --drawer-active:rgba(74,74,74,.10);
  }

  /* 13 · 青序·紫（治愈紫调，以暮衣草紫为主，融入灰青绿/灰蓝/暖粉/暖杏，源自《青序·治愈系生活仪表盘》） */
  html[data-theme="qingxu-purple"] {
    --page-bg:#f2f1f8; --surface-card:#ffffff; --surface-nested:#f5f3fa;
    --border:#e8e4f0; --border-input:#d4cde5;
    --text:#3e3a4e; --text-secondary:#8b85a0; --text-tertiary:#b0aac2;
    --accent:#9181c8; --accent-muted:#eae6f5; --on-accent:#ffffff;
    --module-1:#a7bb80; --module-2:#87c8e6; --module-3:#e7c7d9; --module-4:#efdbc7; --module-5:#9181c8;
    --danger:#bc6c7e; --danger-muted:#f6e9ee;
    --drawer-bg:#f5f3fa; --drawer-bg-top:#faf8fc; --drawer-text:#3e3a4e;
    --drawer-text-mute:rgba(62,58,78,.55); --drawer-hover:rgba(62,58,78,.06); --drawer-active:rgba(62,58,78,.10);
  }
  /* 青序·紫：功能元素用灰青绿，结构元素保持紫色 */
  html[data-theme="qingxu-purple"] .btn { background: var(--module-1); }
  html[data-theme="qingxu-purple"] .eye-bar { background: var(--accent-muted); }
  html[data-theme="qingxu-purple"] .seg .opt.on { background: var(--module-1); border-color: var(--module-1); }
  html[data-theme="qingxu-purple"] .eye-ck input { accent-color: var(--module-1); }
  html[data-theme="qingxu-purple"] .btn-accent { background: var(--accent) !important; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page-bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; min-height: 100vh; min-width: 1000px;
  }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image: var(--page-texture); background-size: cover; background-position: center; opacity:.5; }
  svg { display: block; }
  .layout { min-height: 100vh; }

  /* ---------- 滚动条：无感透明，鼠标移入可滚动区域才淡现 ---------- */
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: transparent; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  *:hover::-webkit-scrollbar-thumb { background-color: color-mix(in srgb, var(--text) 22%, transparent); }
  *::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--text) 36%, transparent); }
  *::-webkit-scrollbar-corner { background: transparent; }
  /* 侧栏是深/浅色面板，滑块改用面板前景色，避免用墨灰导致看不见 */
  .sidebar .nav::-webkit-scrollbar { width: 6px; }
  .sidebar .nav::-webkit-scrollbar-thumb { background: transparent; border-radius: 6px; }
  .sidebar .nav:hover::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--drawer-text) 22%, transparent); }
  .sidebar .nav::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--drawer-text) 38%, transparent); }

  /* ---------- 自绘透明标题栏（无边框窗口，与工作台融为一体） ---------- */
  .tbar { position: fixed; top: 0; left: 0; right: 0; height: var(--titlebar-h); z-index: 40;
    display: flex; align-items: center; user-select: none;
    /* 两段式底色（全主题变量）：左=侧栏渐变顶色，右=页面底色。未滚动时与背后同色不可见，
       内容滚动穿过顶部时被挡住，不再与右上角窗口按钮（最小化/最大化/关闭）重叠 */
    background: linear-gradient(90deg, var(--drawer-bg-top) 0, var(--drawer-bg-top) var(--sidebar-w), var(--page-bg) var(--sidebar-w)); }
  .tbar .tb-name { display: flex; align-items: center; gap: 7px; padding-left: 18px; flex: 0 0 auto;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; color: color-mix(in srgb, var(--drawer-text) 52%, transparent); }
  .tbar .tb-dot { width: 6px; height: 6px; border-radius: 50%; background: color-mix(in srgb, var(--drawer-text) 34%, transparent); }
  .tbar .tb-drag { flex: 1; height: 100%; }
  .tbar .tb-btns { display: flex; height: 100%; flex: 0 0 auto; }
  .tbar .tb-btn { width: 46px; height: 100%; display: grid; place-items: center; cursor: pointer;
    color: var(--text-secondary); transition: background .12s, color .12s; }
  .tbar .tb-btn:hover { background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text); }
  .tbar .tb-btn.close:hover { background: #e5484d; color: #fff; }

  /* ---------- sidebar (固定在左侧，不随内容滚动) ---------- */
  .sidebar { background: linear-gradient(180deg, var(--drawer-bg-top), var(--drawer-bg)); color: var(--drawer-text);
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh; z-index: 30; }
  .sidebar .brand { padding: calc(24px + var(--titlebar-h)) 20px 18px; display: flex; align-items: center; gap: 13px; }
  .sidebar .brand .ava { position: relative; width: 46px; height: 46px; border-radius: 13px; overflow: hidden; flex: 0 0 auto;
    background: var(--drawer-hover); box-shadow: 0 0 0 1px var(--drawer-active); cursor: pointer; }
  .sidebar .brand .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sidebar .brand .ava .cam { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0;
    background: rgba(35,34,32,.5); color: var(--drawer-text); transition: opacity .15s; }
  .sidebar .brand .ava:hover .cam { opacity: 1; }
  .sidebar .brand h1 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; }
  .sidebar .brand p { font-size: 11px; opacity: .5; margin-top: 3px; letter-spacing: .05em; }
  .sidebar .brand .btext { min-width: 0; cursor: pointer; border-radius: 9px; padding: 3px 6px; margin: -3px -6px; transition: background .15s; }
  .sidebar .brand .btext:hover { background: var(--drawer-hover); }
  .sidebar .brand .btext .pen { display: inline-flex; opacity: 0; transition: opacity .15s; }
  .sidebar .brand .btext:hover .pen { opacity: .6; }
  .sidebar .nav { flex: 1; overflow-y: auto; padding: 6px 12px 12px; }
  .sidebar .nav::-webkit-scrollbar { width: 6px; }
  .sidebar .nav::-webkit-scrollbar-thumb { background: var(--drawer-text-mute); border-radius: 6px; }
  .navi { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 11px; cursor: pointer;
    font-size: 14px; font-weight: 500; color: color-mix(in srgb, var(--drawer-text) 82%, transparent); transition: background var(--t-fast); margin-bottom: 1px; position: relative; }
  .navi:hover { background: var(--drawer-hover); }
  .navi.active { background: var(--drawer-active); color: var(--drawer-text); font-weight: 700; }
  /* 激活指示条：侧栏为深色面板，用前景亮色而非墨灰 accent 保证可见 */
  .navi.active::before { content:""; position:absolute; left:0; top:50%; transform:translateY(-50%); width:3px; height:15px; border-radius:3px; background: var(--drawer-text); }
  .navi svg { color: var(--drawer-text-mute); flex: 0 0 auto; }
  .navi.active svg { color: var(--drawer-text); }
  .nav-sep { font-size: 10.5px; opacity: .42; padding: 15px 14px 6px; letter-spacing: .1em; }
  .sidebar .foot { padding: 15px 20px; font-size: 11px; opacity: .42; border-top: 1px solid var(--drawer-hover); }

  /* 工作/私人模式切换 */
  .mode-toggle { display:flex; align-items:center; gap:8px; margin:0 4px 10px; padding:9px 12px; border-radius:11px; cursor:pointer;
    font-size:12.5px; font-weight:700; letter-spacing:.02em; transition:all .15s;
    background:var(--surface-nested); border:1px solid var(--border); color:var(--text-secondary); }
  .mode-toggle:hover { border-color:var(--accent); color:var(--text); }
  .mode-toggle svg { flex:0 0 auto; }
  .mode-toggle.priv { background:var(--module-4); color:#fff; border-color:transparent; }
  .mode-toggle.priv:hover { filter:brightness(1.06); }

  /* ---------- main ---------- */
  .main { margin-left: var(--sidebar-w); padding: calc(26px + var(--titlebar-h)) 34px 48px; overflow-x: hidden; }
  .main > #screen { max-width: min(100%, 1560px); margin: 0 auto; }
  .header { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 6px; }
  .header h2 { font-size: 27px; font-weight: 800; letter-spacing: -.03em; }
  .header p { color: var(--text-secondary); font-size: 13px; margin-top: 5px; }
  .header .spacer { flex: 1; }
  .date-chip { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-secondary);
    background: var(--surface-card); border:1px solid var(--border); border-radius:999px; padding:8px 15px; box-shadow: var(--shadow-card); }
  .date-chip svg { color: var(--text-tertiary); }

  /* ---------- hero banner (顶部大图问候区) ---------- */
  .hero-banner { position: relative; overflow: hidden; border-radius: var(--radius-sheet); border: 1px solid var(--border);
    box-shadow: var(--shadow-card); min-height: 118px; display: flex; flex-direction: column; justify-content: center;
    padding: 16px 22px; margin-bottom: 14px;
    background: var(--surface-nested) var(--greet-image) right center / cover no-repeat; }
  .hero-banner::before { content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(100deg, var(--surface-card) 30%, color-mix(in srgb, var(--surface-card) 78%, transparent) 54%, transparent 78%); }
  .hero-banner > * { position: relative; z-index: 1; }
  .hero-banner .hi { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
  .hero-banner .sub { color: var(--text-secondary); font-size: 13px; margin-top: 5px; max-width: 460px; }
  .hero-banner .hstats { display: flex; gap: 20px; margin-top: 8px; }
  .hero-banner .hstat { display: flex; flex-direction: column; gap: 1px; }
  .hero-banner .hstat .n { font-size: 19px; font-weight: 800; letter-spacing: -.02em; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .hero-banner .hstat .t { font-size: 11px; color: var(--text-secondary); }
  .hero-banner .hstat + .hstat { padding-left: 20px; border-left: 1px solid var(--border-input); }
  .hero-banner .htop { position: absolute; top: 12px; right: 20px; z-index: 2; display: flex; gap: 10px; align-items: center; }

  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .sec-title { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:800; margin: 18px 2px 10px; letter-spacing: -.01em; }
  .sec-title::before { content:""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); }

  /* ---------- dashboard grid ---------- */
  .grid { display: grid; gap: 16px; }
  .g-4 { grid-template-columns: repeat(4, 1fr); }
  .g-3 { grid-template-columns: repeat(3, 1fr); }
  .g-2 { grid-template-columns: repeat(2, 1fr); }
  .g-main { grid-template-columns: 1.55fr 1fr; align-items: start; }

  /* 各模块概况卡片 */
  .modcard-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .modcard { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    padding: 15px 16px; cursor: pointer; transition: transform .12s, box-shadow .18s, border-color .15s; }
  .modcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-overlay); border-color: var(--border-input); }
  .modcard .mc-head { display:flex; align-items:center; gap: 11px; }
  .modcard .mc-ic { width: 36px; height: 36px; border-radius: 10px; display:grid; place-items:center; flex:0 0 auto; }
  .modcard .mc-tt { flex:1; min-width:0; }
  .modcard .mc-name { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-desc { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .modcard .mc-arw { color: var(--text-tertiary); flex:0 0 auto; }
  .modcard .mc-body { display:flex; align-items:baseline; gap: 8px; margin-top: 11px; }
  .modcard .mc-main { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-extra { font-size: 12px; color: var(--text-secondary); }

  /* quote banner */
  .quote { padding: 18px 22px; border-radius: var(--radius-card); position: relative; overflow: hidden;
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
  .quote::before { content:""; position:absolute; left:0; top:18px; bottom:18px; width:3px; border-radius:2px; background: var(--accent); }
  .quote .tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--text-secondary);
    letter-spacing:.04em; margin-bottom:11px; }
  .quote .tag svg { color: var(--text-tertiary); }
  .quote .txt { font-size:20px; font-weight:700; color:var(--text); letter-spacing:-.01em; line-height:1.5; }

  /* overview rings */
  .rings { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:0; }
  .ring { display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 4px; cursor:pointer; min-width:0;
    border-radius: var(--radius-card); transition: background .15s; }
  .ring:hover { background: var(--surface-nested); }
  .ring .dial { position:relative; width:100%; max-width:96px; aspect-ratio:1; }
  .ring .dial svg.gauge { transform: rotate(-90deg); width:100%; height:100%; }
  .ring .dial .mid { position:absolute; inset:0; display:grid; place-items:center; }
  .ring .pct { font-size:16px; font-weight:800; letter-spacing:-.02em; }
  .ring .lbl { font-size:13px; font-weight:700; }
  .ring .sub { font-size:11.5px; color:var(--text-secondary); }
  /* 首页环形进度卡：环更紧凑，靠左排列，不拉满整行 */
  .prog-rings { grid-template-columns:repeat(auto-fit, 116px); justify-content:start; gap:6px; }
  .prog-rings .ring { padding:6px 2px; gap:5px; }

  /* quick add */
  .quick-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
  .qbtn { display:flex; align-items:center; gap:12px; padding:12px 14px; border:none; cursor:pointer; border-radius:var(--radius-tile);
    background:var(--surface-card); border:1px solid var(--border); box-shadow: var(--shadow-card); text-align:left; transition: all .15s; min-width:0; }
  .qbtn:hover { border-color:var(--border-input); transform: translateY(-1px); box-shadow: var(--shadow-overlay); }
  .qbtn .e { position:relative; width:42px; height:42px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto; }
  .qbtn .e .qplus { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%;
    background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card); }
  .qbtn .l { font-size:13.5px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* trend panel */
  .panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding:16px; }
  .panel .ph { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800; }
  .panel .ph svg { color: var(--text-tertiary); }
  .panel .ph .avg { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:500; }
  .trend-svg { width:100%; height:auto; margin-top:14px; display:block; }
  .trend-x { display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:4px; padding:0 6px; }
  .trend-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; height: 168px;
    color: var(--text-tertiary); font-size: 13px; margin-top: 8px; }

  /* ---------- pinned tasks ---------- */
  .pin-list { display:grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .pin { display:flex; align-items:center; gap: 13px; padding: 13px 15px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); transition: box-shadow .15s, transform .12s; }
  .pin:hover { box-shadow: var(--shadow-overlay); transform: translateY(-1px); }
  .pin-ic { width: 38px; height: 38px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto;
    background: var(--surface-nested); border: 1px solid var(--border); }
  .pin-b { flex:1; min-width:0; cursor:pointer; }
  .pin-t { font-size: 14.5px; font-weight: 700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-t.done { text-decoration: line-through; color: var(--text-secondary); }
  .pin-m { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .pin-chk { flex:0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all .15s; }
  .pin-chk.on { background: var(--module-1); border-color: var(--module-1); }
  .pin-chk svg { opacity: 0; }
  .pin-chk.on svg { opacity: 1; }
  .pin-step { flex:0 0 auto; display:flex; gap: 7px; }
  .pin-step button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-input);
    background: var(--surface-nested); color: var(--text); font-size: 18px; line-height: 1; cursor:pointer;
    display:grid; place-items:center; transition: all .15s; }
  .pin-step button:hover { background: var(--accent-muted); border-color: var(--accent); }
  .pin-empty { grid-column: 1 / -1; padding: 26px 20px; text-align:center; color: var(--text-secondary); font-size: 13px; line-height: 1.7;
    background: var(--surface-card); border: 1px dashed var(--border-input); border-radius: var(--radius-tile); }
  .pin-empty .mini-star { display:inline-flex; vertical-align:-2px; color: var(--module-3); }

  /* ---------- toolbar in module view ---------- */
  .toolbar { display:flex; align-items:center; gap:10px; margin: 14px 0 12px; }
  .btn { background:var(--accent); color:var(--on-accent); border:none; border-radius:10px; padding:10px 18px; font-size:14px; cursor:pointer;
    font-weight:700; box-shadow: var(--shadow-card); transition: filter .15s, transform .1s; display:inline-flex; align-items:center; gap:7px; }
  .btn:hover { filter: brightness(1.12); } .btn:active { transform: translateY(1px); }
  .btn.ghost { background:var(--surface-card); color:var(--text-secondary); border:1px solid var(--border-input); box-shadow:none; font-weight:500; }
  .btn.ghost:hover { color:var(--text); }
  .btn.danger { background:var(--danger); }
  .spacer { flex:1; }
  input, textarea { font-family:var(--font); font-size:14px; border:1px solid var(--border-input); border-radius:10px;
    padding:9px 12px; background:var(--surface-card); color:var(--text); outline:none; transition: border-color .15s, box-shadow .15s; width:100%; }
  input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-muted); }
  textarea { resize:vertical; min-height:80px; }
  .search-box { position:relative; width: 240px; }
  .search-box svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); pointer-events:none; }
  .search-box input { padding-left:34px; }

  /* module hero header (per-type summary) */
  .hero { display:flex; align-items:center; gap: 13px; padding: 12px 16px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); margin-bottom: 4px; position:relative; overflow:hidden; }
  .hero.has-cover { padding: 0; min-height: 96px; }
  .hero.has-cover .hero-bg { position:absolute; inset:0; background-size:cover; background-position:center; }
  .hero.has-cover .hero-bg::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg, var(--surface-card) 28%, color-mix(in srgb, var(--surface-card) 60%, transparent) 55%, transparent 80%); }
  .hero.has-cover > .hero-inner { position:relative; z-index:1; padding: 12px 16px; display:flex; align-items:center; gap:13px; }
  .hero-ic { width: 40px; height: 40px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto; }
  .hero-tx { min-width:0; flex:1; }
  .hero-row { display:flex; align-items:baseline; gap: 9px; flex-wrap:wrap; }
  .hero-v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .hero-l { font-size: 13px; color: var(--text-secondary); }

  /* record thumbnail + custom field meta tags */
  .rec .thumb { width:48px; height:48px; border-radius:var(--radius-tile); object-fit:cover; flex:0 0 auto; margin-right:2px; }
  .rec .meta-line { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px; flex:1 0 100%; }
  .rec .meta-tag { font-size:12px; font-weight:600; color:var(--text-secondary); }
  .rec .meta-tag::before { content:"·"; margin-right:6px; color:var(--text-tertiary); }
  .rec .meta-tag:first-child::before { display:none; }

  /* ---- layout variants (open-ended: add .rec-layout-xxx in <style> to extend) ---- */
  /* feature: 大图在上 + 标题 + 正文在下 */
  .rec.rec-layout-feature { padding:0; overflow:hidden; }
  .rec.rec-layout-feature .top { flex-direction:column; align-items:stretch; }
  .rec.rec-layout-feature .thumb { width:100%; height:160px; border-radius:0; margin:0; }
  .rec.rec-layout-feature .feat-title { padding:12px 16px 4px; font-size:15px; font-weight:700; color:var(--text); }
  .rec.rec-layout-feature .feat-body { padding:0 16px 14px; font-size:13px; color:var(--text-secondary); line-height:1.55; }
  /* quote: 大字居中 + 留白 */
  .rec.rec-layout-quote { padding:24px 20px; }
  .rec.rec-layout-quote .quote-text { font-size:18px; font-weight:600; line-height:1.6; color:var(--text); }
  .rec.rec-layout-quote .quote-meta { margin-top:10px; font-size:12px; color:var(--text-tertiary); }


  /* module two-column layout: 左记录 / 右统计侧栏 */
  .mod-layout { display:grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; margin-top: 14px; }
  .mod-side { display:flex; flex-direction:column; gap: 12px; position: sticky; top: 16px; }
  .side-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:14px 15px; }
  .side-card .sh { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; margin-bottom:10px; }
  .side-card .sh svg { color:var(--text-tertiary); }
  .stat-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
  .stat-row:last-child { border-bottom:none; padding-bottom:0; }
  .stat-row .k { font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:7px; }
  .stat-row .k .kd { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .stat-row .val { font-size:14px; font-weight:800; letter-spacing:-.01em; }
  /* 分类占比条 */
  .catbar { margin-top:4px; }
  .catbar .cbrow { display:flex; align-items:center; gap:9px; padding:7px 0; }
  .catbar .cbrow .cbn { font-size:12.5px; color:var(--text); width:52px; flex:0 0 auto; }
  .catbar .cbrow .cbt { flex:1; height:8px; border-radius:999px; background:var(--border); overflow:hidden; }
  .catbar .cbrow .cbt i { display:block; height:100%; border-radius:999px; }
  .catbar .cbrow .cbv { font-size:12px; color:var(--text-secondary); width:56px; text-align:right; flex:0 0 auto; }
  /* 大环形（进度/打卡侧栏） */
  .side-ring { display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px 0 2px; }
  .side-ring .dial { position:relative; width:120px; height:120px; }
  .side-ring .dial svg.gauge { transform: rotate(-90deg); width:120px; height:120px; }
  .side-ring .dial .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .side-ring .big { font-size:26px; font-weight:800; letter-spacing:-.02em; }
  .side-ring .cap { font-size:12px; color:var(--text-secondary); }

  /* finance summary minis */
  .mod-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom: 4px; }
  .mini { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:12px 14px; }
  .mini .l { font-size:12px; color:var(--text-secondary); }
  .mini .v { font-size:19px; font-weight:800; margin-top:3px; letter-spacing:-.02em; }

  /* record list — 行式列表 */
  .rec-grid { display:flex; flex-direction:column; gap:9px; }
  .rec { position:relative; background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:14px 16px; transition: border-color .12s, box-shadow .15s; }
  .rec:hover { border-color: var(--border-input); box-shadow: var(--shadow-overlay); }
  .rec .top { display:flex; align-items:center; gap:12px; }
  .rec .chk { flex:0 0 auto; width:23px; height:23px; border-radius:7px; border:1.6px solid var(--border-input); display:grid; place-items:center;
    cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all .15s; }
  .rec .chk.on { background:var(--module-1); border-color:var(--module-1); }
  .rec .chk svg { opacity:0; } .rec .chk.on svg { opacity:1; }
  .rec .body { flex:1; min-width:0; cursor:pointer; display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .rec .rname { font-weight:700; font-size:14.5px; letter-spacing:-.01em; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .rec .rname.done { text-decoration:line-through; color:var(--text-secondary); }
  .rec .quote-text.done { text-decoration:line-through; color:var(--text-secondary); }
  .rec .rmeta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .rec .rnote { flex:1 0 100%; color:var(--text-secondary); font-size:12.5px; margin-top:5px; white-space:pre-wrap; line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .rec .acts { position:absolute; top:50%; right:8px; transform:translateY(-50%); display:flex; gap:1px; opacity:0; transition: opacity .15s; background:var(--surface-card); }
  .rec:hover .acts { opacity:1; }
  .rec .acts button { border:none; background:transparent; color:var(--text-tertiary); cursor:pointer;
    width:28px; height:28px; border-radius:7px; display:grid; place-items:center; transition: all .15s; }
  .rec .pin-btn:hover { background:var(--surface-nested); color:var(--module-3); }
  .rec .pin-btn.on { color:var(--module-3); opacity:1; } .rec .pin-btn.on svg { fill: var(--module-3); }
  .rec:has(.pin-btn.on) .acts { opacity:1; }
  .rec .del:hover { background:var(--danger-muted); color:var(--danger); }
  .rec .sch-chk { flex:0 0 auto; width:23px; height:23px; border-radius:7px; border:1.6px solid var(--border-input); display:grid; place-items:center;
    cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all .15s; padding:0; }
  .rec .sch-chk.on { background:currentColor; border-color:currentColor; }
  .rec .sch-chk svg { color:var(--on-accent); }
  .rec .pbar { flex:1; min-width:80px; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .rec .pbar i { display:block; height:100%; border-radius:999px; }
  .rec .amt { font-size:15px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; margin-left:auto; font-family:var(--font-num); font-variant-numeric:tabular-nums; }
  .rec .amt.exp { color:var(--danger); } .rec .amt.inc { color:var(--module-1); }
  .rec .streak { font-size:11.5px; color:var(--module-3); font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .rec .rdate { color:var(--text-secondary); font-size:11.5px; margin-left:auto; white-space:nowrap; }
  .empty { text-align:center; color:var(--text-secondary); padding:50px 20px; }
  .empty .e { display:inline-grid; place-items:center; width:56px; height:56px; border-radius:16px; background:var(--surface-card); border:1px solid var(--border); color:var(--text-tertiary); margin-bottom:12px; }

  /* ---------- modal ---------- */
  .overlay { position:fixed; inset:0; background:var(--veil); backdrop-filter: blur(3px); z-index:60;
    display:flex; align-items:center; justify-content:center; animation: fade .16s ease; }
  @keyframes fade { from { opacity:0; } }
  .modal { background:var(--surface-card); border-radius:20px; padding:26px; width:480px; max-width:92vw; max-height:90vh; overflow-y:auto;
    box-shadow:0 24px 60px rgba(0,0,0,.26); animation: pop .18s cubic-bezier(.2,.8,.3,1); }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity:0; } }
  .modal h3 { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .modal .sub { color:var(--text-secondary); font-size:13px; margin:5px 0 18px; }
  .field { margin-bottom:14px; }
  .field label { display:block; color:var(--text-secondary); font-size:13px; margin-bottom:6px; }
  .frow { display:flex; gap:12px; } .frow .field { flex:1; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg .opt { flex:1; min-width:64px; text-align:center; padding:10px; border-radius:11px; border:1px solid var(--border-input);
    cursor:pointer; font-size:13px; font-weight:600; color:var(--text-secondary); transition: all .12s; }
  .seg .opt.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .modal-actions { display:flex; align-items:center; gap:10px; margin-top:22px; }
  .link-danger { color:var(--danger); background:none; border:none; font-size:14px; font-weight:600; cursor:pointer; padding:8px 10px; border-radius:8px; }
  .link-danger:hover { background:var(--danger-muted); }

  /* ============================================================
     BENTO DASHBOARD — 首页复杂网格布局（墨色中性 · 高密度）
     ============================================================ */
  /* 首页固定布局：整屏不滚动，日历自适应撑满剩余高度 */
  .main > #screen.home { height:calc(100vh - 74px - var(--titlebar-h)); display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; }
  .home-stack { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:12px; }
  /* 首页卡片入场：低调淡入上浮，40ms 阶梯 */
  @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } }
  .home-stack > * { animation: fadeUp .28s ease both; }
  .home-stack > *:nth-child(2) { animation-delay: .04s; }
  .home-stack > *:nth-child(3) { animation-delay: .08s; }
  .home-stack > *:nth-child(4) { animation-delay: .12s; }
  .home-stack > *:nth-child(5) { animation-delay: .16s; }
  .home-stack > *:nth-child(6) { animation-delay: .20s; }
  .home-stack > *:nth-child(7) { animation-delay: .24s; }
  .home-stack > *:nth-child(8) { animation-delay: .28s; }
  @media (prefers-reduced-motion: reduce) { .home-stack > * { animation: none; } }
  .home-stack > .clock-card { flex:0 0 auto; margin-bottom:0; }
  .home-stack > .tile { flex:0 0 auto; }
  .home-stack > .tile.prog-card { flex:0 0 auto; min-height:110px; }
  .home-stack > .tile.cal-tile { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  .home-stack > .tile.cal-tile .cal-grid { flex:1 1 auto; min-height:0; grid-auto-rows:minmax(42px,1fr); }
  .home-stack > .tile.cal-tile .cal-cell { min-height:0; }
  .st-btn.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }

  /* 分组标题（EN 副标题 + 中文标题 + 分隔线） */
  .sec-grp { display:flex; align-items:center; gap:12px; margin:26px 2px 14px; }
  .sec-grp .bar { width:4px; height:19px; border-radius:2px; background:var(--accent); flex:0 0 auto; }
  .sec-grp .zh { font-size:16px; font-weight:800; letter-spacing:-.02em; }
  .sec-grp .en { font-size:10.5px; font-weight:800; letter-spacing:.15em; color:var(--text-tertiary); }
  .sec-grp .line { flex:1; height:1px; background:var(--border); }

  /* 通用瓷砖 */
  .tile { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); box-shadow:var(--shadow-card);
    padding:16px 18px; display:flex; flex-direction:column; }
  .tile-h { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .tile-h .tic { color:var(--text-tertiary); display:flex; }
  .tile-h .en { font-size:9.5px; font-weight:800; letter-spacing:.14em; color:var(--text-tertiary); line-height:1; }
  .tile-h .zh { font-size:14px; font-weight:800; letter-spacing:-.01em; line-height:1.15; }
  .tile-h .tt { display:flex; flex-direction:column; gap:3px; }
  .tile-h .r { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:700; }

  /* 整体情况瓷砖 */
  .ov2-body { display:grid; grid-template-columns:1fr 300px; gap:22px; flex:1; align-items:stretch; }
  .ov2-body .rings { align-content:center; }
  .ov2-side { position:relative; overflow:hidden; border-radius:var(--radius-card);
    background:linear-gradient(150deg, color-mix(in srgb, var(--accent) 6%, var(--surface-card)) 0%, color-mix(in srgb, var(--accent) 14%, var(--surface-card)) 62%, color-mix(in srgb, var(--accent) 22%, var(--surface-card)) 100%);
    box-shadow:var(--shadow-card);
    padding:20px; display:flex; flex-direction:column; justify-content:space-between; gap:12px; color:var(--text); }
  .ov2-side::before { content:""; position:absolute; width:190px; height:190px; border-radius:50%; right:-70px; top:-80px;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%); pointer-events:none; }
  .ov2-side::after { content:""; position:absolute; width:150px; height:150px; border-radius:50%; left:-55px; bottom:-70px;
    background:radial-gradient(circle, color-mix(in srgb, var(--module-1) 16%, transparent), transparent 70%); pointer-events:none; }
  .ov2-stat { position:relative; z-index:1; display:flex; align-items:center; gap:13px; cursor:pointer;
    padding:12px 4px; border-radius:var(--radius-tile); transition:background .15s; }
  .ov2-stat:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .ov2-stat + .ov2-stat { border-top:1px solid color-mix(in srgb, var(--accent) 12%, transparent); }
  .ov2-stat .s-ic { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-card); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent); }
  .ov2-stat .s-tx { min-width:0; }
  .ov2-stat .s-v { font-size:24px; font-weight:800; letter-spacing:-.03em; line-height:1.05; color:var(--text);
    font-variant-numeric:tabular-nums; }
  .ov2-stat .s-l { font-size:11.5px; color:var(--text-tertiary); margin-top:3px; }

  /* 大时钟卡（Hero Banner 通栏背景式） */
  .clock-card { position:relative; overflow:hidden; border-radius:var(--radius-sheet);
    background:linear-gradient(140deg, color-mix(in srgb, var(--accent) 4%, var(--surface-card)) 0%, color-mix(in srgb, var(--accent) 10%, var(--surface-card)) 60%, color-mix(in srgb, var(--accent) 18%, var(--surface-card)) 100%);
    color:var(--text); padding:14px 30px; box-shadow:var(--shadow-card); display:flex; flex-direction:row; align-items:center; justify-content:space-between; min-height:0; margin-bottom:18px; }
  .clock-card::before { content:""; position:absolute; width:260px; height:260px; border-radius:50%; right:-80px; top:-110px;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%); }
  .clock-card::after { content:""; position:absolute; width:200px; height:200px; border-radius:50%; left:-70px; bottom:-100px;
    background:radial-gradient(circle, color-mix(in srgb, var(--module-1) 16%, transparent), transparent 70%); }
  .clock-card > * { position:relative; z-index:1; }
  .clock-card .clk-left { display:flex; flex-direction:column; gap:6px; }
  .clock-card .hi { font-size:26px; font-weight:800; letter-spacing:-.02em; }
  .clock-card .sub { font-size:12.5px; opacity:.62; max-width:230px; line-height:1.5; }
  .clock-card .clk-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; text-align:right; }
  .clock-card .clk { font-size:clamp(26px,2.6vw,34px); font-weight:800; letter-spacing:.01em; font-variant-numeric:tabular-nums; line-height:1; }
  .clock-card .cmeta { display:flex; align-items:center; gap:9px; font-size:12px; opacity:.62; }
  .clock-card .cmeta .dot { width:4px; height:4px; border-radius:50%; background:currentColor; }
  .clock-card .clunar { font-size:12px; opacity:.75; padding:3px 10px; border-radius:999px; background:color-mix(in srgb, var(--accent) 10%, transparent); font-weight:600; }

  /* 首页进度卡（大环 + 目标汇总 + 方向进度条） */
  .prog-card { padding:15px 20px 14px; }
  .prog-main { display:grid; grid-template-columns:minmax(120px,150px) auto 1fr; gap:16px; align-items:center; }
  .prog-bigring { display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
  .prog-bigring .dial { position:relative; width:88px; aspect-ratio:1; }
  .prog-bigring .dial svg.gauge { transform:rotate(-90deg); width:100%; height:100%; }
  .prog-bigring .dial .mid { position:absolute; inset:0; display:grid; place-items:center; font-size:17px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .prog-bigring .lbl { font-size:13px; font-weight:700; }
  .prog-bigring .sub { font-size:11px; color:var(--text-secondary); }
  .prog-goal { padding-left:16px; border-left:1px solid var(--border); min-width:120px; }
  .prog-goal .pg-tt { font-size:12px; font-weight:800; }
  .prog-goal .pg-avg { font-size:26px; font-weight:800; letter-spacing:-.03em; line-height:1.1; margin-top:1px; color:var(--accent); }
  .prog-goal .pg-sub { font-size:12px; color:var(--text-secondary); margin-top:3px; line-height:1.5; }
  .prog-goal .pg-more { display:inline-block; margin-top:8px; font-size:12px; font-weight:700; color:var(--accent); cursor:pointer;
    opacity:.85; transition:opacity .15s; }
  .prog-goal .pg-more:hover { opacity:1; text-decoration:underline; }
  .prog-dirs { min-width:0; }
  .prog-dirs .pd-title { font-size:10.5px; font-weight:800; letter-spacing:.04em; color:var(--text-tertiary); margin-bottom:5px; }
  .pd-bar { display:grid; grid-template-columns:68px minmax(0,1fr) 40px; align-items:center; gap:10px; margin-bottom:5px; }
  .pd-bar-l { font-size:12.5px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pd-bar-v { font-size:11.5px; font-weight:700; color:var(--text-secondary); font-variant-numeric:tabular-nums; text-align:right; }
  .pd-bar-t { height:6px; border-radius:4px; background:var(--surface-nested); overflow:hidden; }
  .pd-bar-t i { display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--module-1))); transition:width .3s; }
  .pg-empty { font-size:12.5px; color:var(--text-tertiary); line-height:1.6; }
  .prog-sep { height:1px; background:var(--border); margin-top:10px; margin-bottom:8px; }
  .ststrip { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .ststrip-lb { font-size:12px; font-weight:700; color:var(--text-secondary); flex:0 0 auto; }
  .ststrip .stmoods { gap:6px; }
  .ststrip .stmood { padding:4px 11px; font-size:12px; }
  .ststrip .stmood .sdot { width:8px; height:8px; }
  .ststrip .streasons { gap:5px; }
  .ststrip .streason { padding:4px 9px; font-size:11.5px; }
  .ststrip .stnote { padding:5px 10px; font-size:12px; max-width:200px; }
  .ststrip-hist { margin-left:auto; flex:0 0 auto; }
  .ststrip-hist .sthist { margin:0; padding:0; border-top:none; }

  /* 护眼专注（嵌入今日计划右侧栏的紧凑版） */
  .eye-mini .tile-h .r > span { display:none; }
  .eye-mini .eye-time { font-size:38px; }
  .eye-mini .eye-body { gap:10px; padding-top:6px; }
  .eye-mini .eye-actions { grid-template-columns:1fr 1fr; }
  .eye-mini .eye-actions .btn { padding:8px 10px; font-size:12.5px; }
  .eye-mini .eye-next { font-size:11px; }

  /* 焦点/统计瓷砖 */
  .focus-list { display:flex; flex-direction:column; gap:9px; }
  .focus-row { display:flex; align-items:center; gap:11px; }
  .focus-row .fic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-nested); border:1px solid var(--border); }
  .focus-row .ft { flex:1; min-width:0; cursor:pointer; }
  .focus-row .fn { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .focus-row .fn.done { text-decoration:line-through; color:var(--text-secondary); }
  .focus-row .fm { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .focus-empty { color:var(--text-secondary); font-size:12.5px; line-height:1.7; padding:6px 0; }
  .stat-big { font-size:32px; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .stat-big small { font-size:15px; color:var(--text-secondary); font-weight:700; letter-spacing:0; }
  .stat-cap { font-size:12px; color:var(--text-secondary); margin-top:7px; }
  .prog-line { height:7px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:auto; }
  .prog-line i { display:block; height:100%; border-radius:999px; }

  /* 首页日历（月视图，只做信息展示，不做打卡/连续天数） */
  .cal-nav { width:28px; height:28px; border-radius:9px; border:1px solid var(--border-input); background:var(--surface-nested);
    display:grid; place-items:center; cursor:pointer; color:var(--text-secondary); transition:background .15s, color .15s; }
  .cal-nav:hover { background:var(--accent-muted); color:var(--text); }
  .cal-label { font-size:13px; font-weight:800; letter-spacing:-.01em; min-width:92px; text-align:center; font-variant-numeric:tabular-nums; }
  .cal-today { height:28px; padding:0 12px; border-radius:9px; border:1px solid var(--border-input); background:var(--surface-card);
    font-size:12px; font-weight:700; color:var(--text-secondary); cursor:pointer; transition:background .15s, color .15s; }
  .cal-today:hover { background:var(--accent-muted); color:var(--text); }
  .cal-week { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:5px; }
  .cal-week span { text-align:center; font-size:11px; font-weight:700; color:var(--text-tertiary); letter-spacing:.05em; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; }
  .home-stack > .tile.cal-tile { padding-top:11px; padding-bottom:8px; }
  .home-stack > .tile.cal-tile .tile-h { margin-bottom:6px; }
  /* 格子：普通格用主题浅色底、小圆角、紧凑间距；排期改用格内色条，不再整格染色 */
  .cal-cell { position:relative; min-height:42px; border-radius:4px; background:var(--surface-nested); border:1px solid transparent;
    padding:5px 6px; overflow:hidden; }
  /* 日期数字统一直接显示，不套底牌方框；今天/选中用 accent 区分 */
  .cal-cell .cnb { position:absolute; top:4px; left:6px; display:grid; place-items:center; min-width:19px; height:16px; border-radius:3px; z-index:2; }
  .cal-cell .cnb .cn { font-size:11px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; line-height:1; padding:0 3px; }
  .cal-cell.out { background:transparent; }
  .cal-cell.out .cnb .cn { color:var(--text-tertiary); opacity:.7; }
  .cal-cell.out .cnb { background:transparent; }
  /* 今天：accent 边框 + 数字 accent 加粗；选中：内描边轮廓 + accent 数字，不覆盖任何内容 */
  .cal-cell.today .cnb .cn { font-weight:800; color:var(--accent); }
  .cal-cell.today { border-color: var(--accent); }
  .cal-cell.selected { outline:2px solid var(--accent); outline-offset:-2px; }
  .cal-cell.selected .cnb .cn { color:var(--accent); }
  .cal-cell .cflag { position:absolute; top:4px; right:5px; font-size:9px; line-height:1; font-weight:800; padding:2.5px 4px; border-radius:5px; }
  .cal-cell .cflag.off { color:var(--danger); background:var(--danger-muted); }
  .cal-cell .cflag.work { color:var(--module-2); background:color-mix(in srgb, var(--module-2) 14%, transparent); }
  .cal-cell .ch { display:block; font-size:9.5px; line-height:1.2; font-weight:700; color:var(--danger); margin-top:20px; padding-right:16px; }
  /* 内容区限高 = 2整行(14px×2) + 1px gap，保证整行截断，绝不出现半行残影 */
  .cal-cell .cevt-l { display:flex; flex-direction:column; gap:1px; margin-top:20px; overflow:hidden; max-height:29px; }
  .cal-cell .cevt { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:100%;
    font-size:10px; line-height:14px; font-weight:600; color:var(--text); border-radius:0; padding:0 2px; }
  .cal-cell .cevt.more { color:var(--text-tertiary); background:transparent; font-weight:700; }
  .cal-cell .cevt.done { text-decoration:line-through; color:var(--text-secondary); }
  /* 排期：一条排期一根通栏色条 + 标题，颜色按分类从主题色取，同分类多条用深浅区分 */
  .cal-cell .csch { display:flex; flex-direction:column; gap:0; overflow:hidden; }
  .cal-cell .csch-bar { display:block; height:3px; border-radius:2px; }
  .cal-cell .csch-t { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    font-size:10px; line-height:11px; font-weight:600; color:var(--text); }
  .cal-cell .cmore { position:absolute; right:4px; bottom:3px; z-index:2; font-size:9.5px; font-weight:700;
    color:var(--text-tertiary); background:var(--surface-card); padding:0 3px; border-radius:3px; }
  /* 日期回看弹层 */
  .dpop-dow { font-size:12px; font-weight:600; color:var(--text-tertiary); }
  .dpop-flag { font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; }
  .dpop-flag.off { color:var(--danger); background:var(--danger-muted); }
  .dpop-flag.work { color:var(--module-2); background:color-mix(in srgb, var(--module-2) 14%, transparent); }
  .dpop-sec { margin-bottom:14px; }
  .dpop-lab { font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--text-tertiary); margin-bottom:7px; }
  .dpop-st { display:flex; align-items:center; gap:8px; font-size:13.5px; flex-wrap:wrap; }
  .dpop-st.dim, .dim { color:var(--text-tertiary); }
  .dpop-chip { font-size:11.5px; padding:2px 9px; border-radius:999px; background:var(--surface-nested); border:1px solid var(--border-input); color:var(--text-secondary); }
  .dpop-note { font-size:12.5px; color:var(--text-secondary); }
  .dpop-list { margin:0; padding-left:18px; font-size:13px; display:flex; flex-direction:column; gap:5px; }
  /* === 新版日历弹窗样式 === */
  .dpop-head { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .dpop-hmain { flex:1; min-width:0; text-align:center; }
  .dpop-nav { width:30px; height:30px; border-radius:9px; border:1px solid var(--border-input); background:var(--surface-nested); color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .dpop-nav:hover { background:var(--accent-muted); color:var(--accent); border-color:var(--accent); }
  .dpop-today { font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--accent); color:var(--on-accent); margin-left:4px; }
  .dpop-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .dpop-group-wrap { display:flex; flex-direction:column; gap:10px; margin-bottom:12px; max-height:320px; overflow-y:auto; padding-right:2px; }
  .dpop-group { background:var(--surface-nested); border-radius:10px; padding:10px 12px; }
  .dpop-ghead { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; margin-bottom:8px; }
  .dpop-ghead .dim { font-weight:500; font-size:11px; margin-left:auto; }
  .dpop-gtic { width:20px; height:20px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .dpop-row { display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px dashed var(--border-input); font-size:13px; cursor:pointer; transition:background .1s; }
  .dpop-row:hover { background:rgba(0,0,0,.02); }
  .dpop-row:last-child { border-bottom:none; }
  .dpop-chk { width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border-input); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--surface-card); flex-shrink:0; padding:0; transition:all .12s; }
  .dpop-chk:hover { border-color:var(--accent); }
  .dpop-chk.on { background:var(--accent); border-color:var(--accent); }
  .dpop-row-t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dpop-row-t.done { color:var(--text-tertiary); text-decoration:line-through; }
  .dpop-row-brief { font-size:11.5px; margin-top:1px; }
  .dpop-pri { font-size:10px; font-weight:700; padding:1px 7px; border-radius:4px; flex-shrink:0; }
  .dpop-quick { display:flex; gap:6px; flex-wrap:wrap; padding-top:4px; border-top:1px solid var(--border-input); padding-top:10px; }
  .dpop-qbtn { display:flex; align-items:center; gap:4px; padding:6px 10px; border-radius:8px; border:1px solid var(--border-input); background:var(--surface-card); font-size:12px; font-weight:600; color:var(--text-secondary); cursor:pointer; transition:all .12s; font-family:inherit; }
  .dpop-qbtn:hover { background:var(--accent-muted); color:var(--accent); border-color:var(--accent); }

  /* 习惯追踪周网格表 */
  .habit-tb { width:100%; border-collapse:collapse; }
  .habit-tb th { font-size:10.5px; font-weight:700; color:var(--text-tertiary); padding:0 0 9px; text-align:center; }
  .habit-tb th.hh { text-align:left; }
  .habit-tb th.hr { text-align:right; }
  .habit-tb td { padding:5px 0; text-align:center; vertical-align:middle; }
  .habit-tb td.hn { text-align:left; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px; }
  .habit-tb td.hn .hdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .habit-tb td.hrate { text-align:right; font-size:12.5px; font-weight:800; letter-spacing:-.02em; }
  .hcell { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:7px; color:var(--on-accent); cursor:pointer; transition:transform .12s; }
  .hcell:hover { transform:scale(1.12); }
  .hcell.on { background:var(--module-1); }
  .hcell.off { background:var(--surface-nested); border:1px solid var(--border); }
  .hcell svg { opacity:0; } .hcell.on svg { opacity:1; }
  .habit-tb .tdcol { background:var(--accent-muted); }
  .habit-tb col.todaycol { background:var(--accent-muted); }

  /* 待办清单（仪表盘式） */
  .tk-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .tk-head .pct { font-size:22px; font-weight:800; letter-spacing:-.03em; }
  .tk-head .cnt { font-size:12px; color:var(--text-secondary); font-weight:700; }
  .tk-head .bar { flex:1; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .tk-head .bar i { display:block; height:100%; border-radius:999px; background:var(--accent); }
  .tk-list { display:flex; flex-direction:column; }
  .tk-row { display:flex; align-items:center; gap:11px; padding:8px 0; border-bottom:1px solid var(--border); }
  .tk-row:last-child { border-bottom:none; }
  .tk-chk { flex:0 0 auto; width:20px; height:20px; border-radius:6px; border:1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition:all .15s; }
  .tk-chk.on { background:var(--module-1); border-color:var(--module-1); }
  .tk-chk svg { opacity:0; } .tk-chk.on svg { opacity:1; }
  .tk-name { flex:1; min-width:0; font-size:13.5px; font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tk-name.done { text-decoration:line-through; color:var(--text-secondary); }

  /* 在读好书 */
  .book-list { display:flex; flex-direction:column; gap:12px; }
  .book-row { display:flex; align-items:center; gap:12px; cursor:pointer; }
  .book-row .spine { width:34px; height:46px; border-radius:5px; flex:0 0 auto; position:relative; box-shadow:var(--shadow-card);
    display:grid; place-items:center; color:var(--on-accent); }
  .book-row .spine::after { content:""; position:absolute; left:4px; top:4px; bottom:4px; width:2px; border-radius:2px; background:rgba(255,255,255,.35); }
  .book-row .bmid { flex:1; min-width:0; }
  .book-row .btt { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .book-row .bsub { font-size:11px; color:var(--text-secondary); margin-top:3px; }
  .book-row .bbar { height:5px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:7px; }
  .book-row .bbar i { display:block; height:100%; border-radius:999px; }
  .book-row .bpct { font-size:14px; font-weight:800; letter-spacing:-.02em; flex:0 0 auto; }

  /* 本周目标 / 通用目标条 */
  .goal-list { display:flex; flex-direction:column; gap:13px; }
  .goal-row .gt { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin-bottom:7px; }
  .goal-row .gt .gp { margin-left:auto; font-size:12.5px; font-weight:800; color:var(--text-secondary); letter-spacing:-.02em; }
  .goal-row .gt .gdone { color:var(--module-1); display:flex; }
  .goal-row .gbar { height:7px; border-radius:999px; background:var(--border); overflow:hidden; }
  .goal-row .gbar i { display:block; height:100%; border-radius:999px; }

  /* 月度开销 */
  .spend-sum { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .spend-total { font-size:26px; font-weight:800; letter-spacing:-.03em; }
  .spend-cap { font-size:11.5px; color:var(--text-secondary); }

  /* ---------- 侧栏工具（外观 / 导出 / 同步） ---------- */
  .side-tools { padding: 14px 18px 0; border-top: 1px solid var(--drawer-hover); }
  .st-label { font-size:10.5px; letter-spacing:.1em; opacity:.42; margin-bottom:9px; }
  .theme-bar { display:flex; gap:8px; flex-wrap:wrap; }
  .theme-dot { width:26px; height:26px; border-radius:9px; cursor:pointer; border:1px solid var(--drawer-active);
    transition: transform .12s, box-shadow .15s; }
  .theme-dot:hover { transform: translateY(-1px); }
  .theme-dot.on { box-shadow: 0 0 0 2px var(--drawer-text); }
  .st-actions { display:flex; gap:8px; margin-top:12px; }
  .st-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:8px 4px; font-size:12px;
    color:var(--drawer-text); background:var(--drawer-hover); border:1px solid var(--drawer-active); border-radius:9px;
    cursor:pointer; transition:background .15s; }
  .st-btn:hover { background:var(--drawer-active); }

  /* ---------- 分类页签 ---------- */
  .tabbar { display:flex; gap:8px; flex-wrap:wrap; margin: 14px 0 2px; }
  .tab { padding:7px 15px; border-radius:999px; border:1px solid var(--border-input); background:var(--surface-card);
    font-size:12.5px; font-weight:600; color:var(--text-secondary); cursor:pointer; transition: all .14s; }
  .tab:hover { color:var(--text); border-color:var(--accent); }
  .tab.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700; }
  .tab .tnum { opacity:.6; margin-left:5px; font-weight:500; }

  /* ---------- 长期计划：+1 / -1 ---------- */
  .step-box { display:flex; flex-direction:column; gap:6px; margin-left:10px; }
  .step-btn { width:30px; height:30px; display:grid; place-items:center; border-radius:9px; cursor:pointer;
    border:1px solid var(--border-input); background:var(--surface-card); color:var(--text-secondary); transition:all .14s; }
  .step-btn:hover { color:var(--accent); border-color:var(--accent); }

  /* ---------- 轻提示 ---------- */
  .toast { position:fixed; left:50%; bottom:38px; transform:translateX(-50%); z-index:90; background:var(--text);
    color:var(--page-bg); font-size:13px; font-weight:600; padding:11px 20px; border-radius:12px;
    box-shadow:var(--shadow-overlay); animation:pop .2s cubic-bezier(.2,.8,.3,1); max-width:540px; text-align:center; }

  /* ---------- 老板键：伪装态下藏起侧栏的功能入口 ---------- */
  body.boss-on .nav, body.boss-on .side-tools { display:none !important; }

  /* ---------- 本地资料（文档阅读） ---------- */
  .rd-wrap { display:grid; grid-template-columns: 236px 1fr; gap:16px; align-items:start; margin-top:14px; }
  .rd-toc { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); box-shadow:var(--shadow-card);
    padding:14px; position:sticky; top:16px; max-height:calc(100vh - 130px); overflow-y:auto; }
  .rd-toc .rh { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; margin-bottom:10px; color:var(--text-secondary); }
  .rd-toc .tc { padding:8px 10px; border-radius:9px; font-size:12.5px; color:var(--text-secondary); cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:background .14s,color .14s; }
  .rd-toc .tc:hover { background:var(--surface-nested); color:var(--text); }
  .rd-toc .tc.on { background:var(--accent-muted); color:var(--text); font-weight:700; }
  .rd-pane { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); box-shadow:var(--shadow-card);
    overflow:hidden; display:flex; flex-direction:column; }
  .rd-bar { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--border);
    background:var(--surface-nested); flex-wrap:wrap; }
  .rd-bar .rpos { font-size:12px; color:var(--text-secondary); font-variant-numeric:tabular-nums; }
  .rd-bar .spacer { flex:1; }
  .rd-bar .rd-doc { font-size:13.5px; font-weight:800; letter-spacing:-.01em; max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rd-tool { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--border-input); background:var(--surface-card);
    color:var(--text-secondary); border-radius:8px; padding:5px 9px; font-size:12px; cursor:pointer; transition:all .14s; }
  .rd-tool:hover { color:var(--text); border-color:var(--accent); }
  .rd-scroll { overflow-y:auto; height:calc(100vh - 252px); }
  .rd-body { margin:0 auto; padding:32px 40px 80px; }
  .rd-title { font-size:19px; font-weight:800; letter-spacing:-.02em; margin-bottom:22px; color:var(--text); }
  .rd-body p { margin:0 0 1.05em; text-indent:2em; color:var(--text); }
  .rd-foot { font-size:11.5px; color:var(--text-tertiary); border-top:1px solid var(--border); padding:9px 16px; background:var(--surface-nested); }
  .rd-empty { text-align:center; padding:60px 20px; }
  .rd-empty .rd-e-ic { display:inline-grid; place-items:center; width:60px; height:60px; border-radius:18px;
    background:var(--surface-nested); border:1px solid var(--border); color:var(--text-tertiary); margin-bottom:14px; }
  .rd-empty h3 { font-size:17px; font-weight:800; margin-bottom:8px; }
  .rd-empty p { color:var(--text-secondary); font-size:13px; line-height:1.8; max-width:440px; margin:0 auto 20px; }
  .rd-empty .row { display:flex; gap:10px; justify-content:center; }

  /* ---------- 老板键：假数据报表页 ---------- */
  .rpt-tb { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  .rpt-tb th { font-size:11.5px; font-weight:700; color:var(--text-secondary); text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); }
  .rpt-tb td { font-size:13px; padding:11px 12px; border-bottom:1px solid var(--border); }
  .rpt-tb tr:last-child td { border-bottom:none; }
  .rpt-tb th.num, .rpt-tb td.num { text-align:right; }
  .rpt-tb .up { color:var(--module-1); font-weight:700; }
  .rpt-tb .down { color:var(--danger); font-weight:700; }

  /* ---------- 目标拆解（方向→总目标→阶段→周→执行任务） ---------- */
  .goal-tree { display:flex; flex-direction:column; gap:14px; }
  .gdir { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:8px 10px; cursor:grab; transition:opacity .15s, box-shadow .15s; }
  .gdir.dragging { opacity:.35; cursor:grabbing; }
  .gdir.drag-over { box-shadow:0 -3px 0 var(--accent); }
  .gdir > .gnode:first-child > .grow .gname { font-size:15px; }
  .gempty { padding:44px 20px; text-align:center; color:var(--text-secondary); background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); box-shadow:var(--shadow-card); }
  .grow { display:flex; align-items:center; gap:9px; padding:10px 8px; border-radius:11px; transition:background .14s; }
  .grow:hover { background:var(--surface-nested); }
  /* 节点标题行拖拽：拖到另一节点上=成为其最后一个子节点 */
  .grow[data-grow] { cursor:grab; }
  .grow.dragging { opacity:.35; }
  .grow.drag-over { outline:2px dashed var(--accent); outline-offset:-2px; background:var(--accent-muted); }
  .grow .gcar { width:26px; height:26px; flex:0 0 auto; border:none; background:transparent; color:var(--text-tertiary);
    cursor:pointer; display:grid; place-items:center; border-radius:8px; transition:transform .2s, background .14s, color .14s; outline:none; }
  .grow .gcar:hover { background:var(--accent-muted); color:var(--accent); }
  .grow .gcar:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .grow .gcar.collapsed { transform:rotate(0deg); }
  .grow .gcar:not(.collapsed) { transform:rotate(90deg); }
  .grow .gcar.leaf { visibility:hidden; }
  .grow .gic { width:27px; height:27px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto; }
  .grow .gname { font-weight:700; font-size:14px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:280px; }
  .grow .glv { font-size:10.5px; font-weight:800; letter-spacing:.05em; color:var(--text-tertiary);
    padding:2px 7px; border-radius:999px; background:var(--surface-nested); flex:0 0 auto; }
  .grow .gtrack { flex:1; min-width:50px; height:7px; border-radius:999px; background:var(--border); overflow:hidden; }
  .grow .gtrack i { display:block; height:100%; border-radius:999px; transition:width .25s ease; }
  .grow .gpct { font-size:12.5px; font-weight:800; width:42px; text-align:right; flex:0 0 auto; font-variant-numeric:tabular-nums; }
  .grow .gdline { font-size:11.5px; color:var(--text-secondary); flex:0 0 auto; white-space:nowrap; }
  .grow .gacts { display:flex; gap:1px; flex:0 0 auto; opacity:0; transition:opacity .14s; }
  .grow:hover .gacts { opacity:1; }
  .grow .gacts button { border:none; background:transparent; color:var(--text-tertiary); cursor:pointer; width:26px; height:26px;
    border-radius:7px; display:grid; place-items:center; transition:all .14s; }
  .grow .gacts button:hover { background:var(--surface-card); color:var(--accent); }
  .grow .gacts button.gdel:hover { background:var(--danger-muted); color:var(--danger); }
  .gsub { padding:0 8px 9px 38px; font-size:12px; color:var(--text-secondary); }
  .gtask { display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:10px; }
  .gtask:first-child { margin-top:2px; }
  .gtask .chk { flex:0 0 auto; width:19px; height:19px; border-radius:6px; border:1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition:all .15s; }
  .gtask .chk.on { background:var(--module-1); border-color:var(--module-1); }
  .gtask .chk svg { opacity:0; } .gtask .chk.on svg { opacity:1; }
  .gtask .gt-name { font-size:13.5px; font-weight:600; cursor:pointer; }
  .gtask .gt-name:hover { color:var(--accent); }
  .gtask .gt-name.done { text-decoration:line-through; color:var(--text-secondary); }
  .gtask .gt-date { font-size:11.5px; color:var(--text-tertiary); margin-left:auto; }
  .gtask .gt-sched { flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:6px; border:1px solid var(--border-input);
    background:transparent; color:var(--text-tertiary); cursor:pointer; }
  .gtask .gt-sched.on { background:var(--accent-muted); border-color:var(--accent-muted); color:var(--accent); }
  .gtask .gt-sched:hover { color:var(--accent); border-color:var(--accent); }
  .gtask-add { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--text-secondary);
    background:none; border:none; cursor:pointer; padding:7px 8px; border-radius:8px; margin-top:2px; transition:all .14s; }
  .gtask-add:hover { color:var(--accent); background:var(--surface-nested); }
  .gtasks { border-left:1px solid var(--border); padding-left:10px; margin:3px 0 6px; display:flex; flex-direction:column; gap:2px; }
  .gtasks-sum { align-self:flex-start; border:none; background:transparent; color:var(--text-tertiary); font-size:12px;
    font-weight:600; cursor:pointer; padding:3px 6px; border-radius:6px; transition:color .14s, background .14s; }
  .gtasks-sum:hover { color:var(--accent); background:var(--surface-nested); }
  .gtnum { font-size:11.5px; color:var(--text-tertiary); white-space:nowrap; }
  /* ---------- 进度模式 / 尚未拆解 / 已归档（阶段 A） ---------- */
  .grow .gpct.wide { width:auto; min-width:42px; }
  .grow .gmode { font-size:10px; font-weight:800; letter-spacing:.04em; color:var(--text-tertiary);
    border:1px solid var(--border); border-radius:999px; padding:1px 7px; flex:0 0 auto; background:var(--surface-nested); }
  .grow .gdecomp { border:1px solid var(--border-input); background:var(--surface-card); color:var(--accent);
    font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; cursor:pointer; flex:0 0 auto; transition:all .14s; }
  .grow .gdecomp:hover { background:var(--accent-muted); }
  .gm { font-size:12.5px; color:var(--text-secondary); line-height:1.7; background:var(--surface-nested); border-radius:10px; padding:9px 11px; }
  .gmhint { font-size:12px; color:var(--text-tertiary); line-height:1.6; margin-top:2px; }
  .link-quiet { color:var(--text-secondary); background:none; border:none; font-size:14px; font-weight:600;
    cursor:pointer; padding:8px 10px; border-radius:8px; }
  .link-quiet:hover { background:var(--surface-nested); color:var(--text); }
  .arc-list { max-height:46vh; overflow:auto; margin-top:4px; }
  .arc-row { display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border); }
  .arc-row:last-child { border-bottom:none; }
  .arc-row .gic { width:26px; height:26px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto; }
  .arc-info { flex:1; min-width:0; }
  .arc-t { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .arc-p { font-size:11.5px; color:var(--text-tertiary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .arc-row .btn { padding:5px 10px; font-size:12.5px; }
  .arc-row .arc-del:hover { color:var(--danger); }
  /* ---------- 循环计划（阶段 B） ---------- */
  .repb { background:var(--accent-muted); color:var(--accent); }
  .tmpb { background:var(--surface-nested); color:var(--text-tertiary); }
  /* 子目标自动状态徽标：按进度推导，颜色全部复用主题变量 */
  .gstb { font-size:11px; }
  .gstb.doing { background:var(--accent-muted); color:var(--accent); }
  .gstb.done  { background:color-mix(in srgb, var(--module-1) 15%, transparent); color:var(--module-1); }
  .gstb.todo  { background:var(--surface-nested); color:var(--text-tertiary); }
  .rep-days { display:flex; gap:6px; }
  .rday { flex:1; text-align:center; padding:7px 0; border-radius:8px; border:1px solid var(--border-input);
    background:var(--surface-card); font-size:12.5px; font-weight:700; color:var(--text-secondary); cursor:pointer; transition:all .14s; user-select:none; }
  .rday.on { background:var(--accent-muted); border-color:var(--accent); color:var(--accent); }

  /* ---------- 方向推进（首页块：每条方向最近在不在往前走） ---------- */
  .mom-list { display:flex; flex-direction:column; gap:8px; }
  .mom-row { display:flex; align-items:center; gap:12px; padding:11px 12px; border:1px solid var(--border);
    border-radius:var(--radius-tile); background:var(--surface-card); cursor:pointer; transition:border-color .14s, box-shadow .15s; }
  .mom-row:hover { border-color:var(--border-input); box-shadow:var(--shadow-overlay); }
  .mom-ic { width:32px; height:32px; border-radius:10px; display:grid; place-items:center; flex:0 0 auto; background:var(--surface-nested); }
  .mom-main { flex:1; min-width:0; }
  .mom-top { display:flex; align-items:center; gap:10px; }
  .mom-name { font-weight:700; font-size:14px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mom-recent { font-size:11.5px; color:var(--text-tertiary); margin-left:auto; white-space:nowrap; flex:0 0 auto; }
  .mom-recent.stale { color:var(--module-3); font-weight:800; }
  .mom-meta { font-size:12.5px; color:var(--text-secondary); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mom-meta .dim { color:var(--text-tertiary); }
  .mom-prog { flex:0 0 auto; display:flex; align-items:center; gap:9px; width:190px; }
  .mom-track { flex:1; height:7px; border-radius:999px; background:var(--border); overflow:hidden; }
  .mom-track i { display:block; height:100%; border-radius:999px; transition:width .25s ease; }
  .mom-pct { font-size:12.5px; font-weight:800; color:var(--module-2); width:38px; text-align:right; font-variant-numeric:tabular-nums; }
  .mom-empty { padding:22px; text-align:center; color:var(--text-secondary); font-size:13px; }

  /* ---------- 护眼专注 ---------- */
  .eye-body { display:flex; flex-direction:column; align-items:center; gap:12px; padding:22px 0 10px; }
  .eye-time { font-size:58px; font-weight:800; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums; color:var(--text); }
  #eye-tile[data-phase="break"] .eye-time { color:var(--module-3); }
  .eye-phase { font-size:12.5px; font-weight:800; letter-spacing:.08em; color:var(--text-secondary); }
  .eye-bar { width:min(440px,72%); height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .eye-bar i { display:block; height:100%; border-radius:999px; background:var(--module-1); transition:width .5s linear; }
  #eye-tile[data-phase="break"] .eye-bar i { background:var(--module-3); }
  .eye-actions { display:flex; gap:10px; margin-top:2px; }
  .eye-next { font-size:12.5px; color:var(--text-tertiary); }
  .eye-ck { display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600; cursor:pointer; padding:9px 0; color:var(--text); }
  .eye-ck input { width:17px; height:17px; accent-color:var(--accent); cursor:pointer; }

  /* ---------- 今日状态 ---------- */
  .stile .stbody { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:2px 0; }
  .stmoods { display:flex; gap:8px; }
  .stmood { display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border-radius:999px; border:1px solid var(--border-input); background:var(--surface-nested); font-size:13px; font-weight:600; color:var(--text-secondary); cursor:pointer; transition:all .15s; }
  .stmood .sdot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .stmood:hover { border-color:var(--accent); color:var(--text); }
  .stmood.on { background:var(--surface-card); border-color:var(--accent); color:var(--text); box-shadow:var(--shadow-card); }
  .streasons { display:flex; gap:6px; flex-wrap:wrap; }
  .streason { padding:5px 11px; border-radius:999px; border:1px solid var(--border-input); background:transparent; font-size:12px; color:var(--text-secondary); cursor:pointer; transition:all .15s; }
  .streason:hover { border-color:var(--accent); }
  .streason.on { background:var(--surface-nested); border-color:var(--accent); color:var(--text); font-weight:600; }
  .stnote { flex:1; min-width:180px; padding:8px 12px; border-radius:10px; border:1px solid var(--border-input); background:var(--surface-card); font-size:13px; color:var(--text); }

/* ============================================================
