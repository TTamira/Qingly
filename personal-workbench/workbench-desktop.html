  sc.querySelectorAll("[data-gdel]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); goalDelConfirm(find(el.dataset.gdel)); });
  sc.querySelectorAll("[data-gdecomp]").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const node=find(el.dataset.gdecomp); if(node) openGoalEditor(null,node); });
  const arcBtn=$("#g-arc"); if(arcBtn) arcBtn.onclick=()=>openArchiveList();
  sc.querySelectorAll("[data-gtaskchk]").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const t=(data.todo||[]).find(x=>x.id==el.dataset.gtaskchk); if(!t) return;
    todoToggle(t); persist(); });
  sc.querySelectorAll("[data-gtaskopen]").forEach(el=>el.onclick=()=>{ const t=(data.todo||[]).find(x=>x.id==el.dataset.gtaskopen); if(t) openEditor("todo",t,{gsrc:true}); });
  // 安排 / 移出今日计划：只改 sched，不动完成状态，不影响目标进度
  sc.querySelectorAll("[data-gtasksched]").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const t=(data.todo||[]).find(x=>x.id==el.dataset.gtasksched); if(!t) return;
    if(inPlan(t)){ t.sched=false; toast("已移出今日计划"); }
    else { t.sched=true; toast("已安排到今日计划"); }
    persist(); });
  sc.querySelectorAll("[data-gtaskadd]").forEach(el=>el.onclick=()=>{ const node=find(el.dataset.gtaskadd); if(node) addTask(node); });
  const nd=$("#g-new-dir"); if(nd) nd.onclick=()=>openGoalEditor(null,null);
  const ex=$("#g-expand"); if(ex) ex.onclick=()=>{
    const o={}, open={};
    const walk=(ns,d)=>(ns||[]).forEach(n=>{ o[n.id]=true; if((n.children||[]).length&&!gOpen(n.id,d)) open.collapsed=true; walk(n.children,d+1); });
    walk(data.goal,0);
    // 还有折叠节点 → 点这次是全部展开；已经全展开 → 点这次是全部折叠
    Object.keys(o).forEach(id=>o[id]=!!open.collapsed);
    data.__goalOpen=o; persist();
  };

  // 拖拽：标题行(.grow)拖到另一节点上=成为其最后一个子节点；方向卡片(.gdir)空白处拖拽=排序
  let dragDirId=null, dragNodeId=null;
  const clearDragOver=()=>sc.querySelectorAll(".gdir.drag-over,.grow.drag-over").forEach(g=>g.classList.remove("drag-over"));
  const nestInto=(srcId,dstId)=>{
    const src=find(srcId), dst=find(dstId);
    if(!src||!dst||src===dst) return;
    if(goalSubtreeIds(src).includes(String(dst.id))) return;    // 防环：不能拖进自己或自己的子孙
    const eSrc=goalIndex()[src.id];
    const arr=(eSrc&&eSrc.parentNode)?eSrc.parentNode.children:(data.goal||[]);
    const i=arr.indexOf(src); if(i>=0) arr.splice(i,1);         // 从原父级摘出
    dst.children=dst.children||[]; dst.children.push(src);      // 挂到目标末尾并展开
    // 按新深度修正层级标签（方向/总目标/阶段/子目标），进度在 render 时自下而上自动重算
    const relv=(n,d)=>{ n.lv=GOAL_LEVELS[Math.min(d,3)].key; (n.children||[]).forEach(k=>relv(k,d+1)); };
    relv(src,(ix[dst.id]?ix[dst.id].path.length:0)+1);
    data.__goalOpen=data.__goalOpen||{}; data.__goalOpen[dst.id]=true;
    persist();
  };

  sc.querySelectorAll(".grow[data-grow]").forEach(el=>{
    el.addEventListener("dragstart",e=>{
      if(e.target.closest("button,input,a,textarea,select")){ e.preventDefault(); return; }
      dragNodeId=el.dataset.grow; el.classList.add("dragging");
      e.stopPropagation();                                      // 别同时触发方向卡片排序拖拽
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain", String(dragNodeId)); }catch(err){}
    });
    el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); dragNodeId=null; clearDragOver(); });
    el.addEventListener("dragover",e=>{
      if(!dragNodeId||el.dataset.grow===dragNodeId) return;     // 卡片排序拖拽放行给 .gdir 处理
      const src=find(dragNodeId), dst=find(el.dataset.grow);
      if(!src||!dst||goalSubtreeIds(src).includes(String(dst.id))) return;
      e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect="move";
      clearDragOver(); el.classList.add("drag-over");
    });
    el.addEventListener("dragleave",()=>el.classList.remove("drag-over"));
    el.addEventListener("drop",e=>{
      if(!dragNodeId) return;                                   // 卡片排序拖拽，放行给 .gdir 处理
      e.preventDefault(); e.stopPropagation();
      const id=dragNodeId; dragNodeId=null;
      nestInto(id, el.dataset.grow); clearDragOver();
    });
  });

  // 方向卡片拖拽排序
  sc.querySelectorAll(".gdir").forEach(el=>{
    el.addEventListener("dragstart",e=>{
      if(dragNodeId){ e.preventDefault(); return; }
      if(e.target.closest("button,input,a,textarea,select")){ e.preventDefault(); return; }
      dragDirId=el.dataset.gdir; el.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain", String(el.dataset.gdir)); }catch(err){}
    });
    el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); dragDirId=null; clearDragOver(); });
    el.addEventListener("dragover",e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move";
      clearDragOver();
      if(el.dataset.gdir!==dragDirId && el.dataset.gdir!==dragNodeId) el.classList.add("drag-over"); });
    el.addEventListener("drop",e=>{ e.preventDefault(); e.stopPropagation();
      if(dragNodeId){                                           // 嵌套拖拽落在卡片空白处 → 也挂到该方向末尾
        const id=dragNodeId; dragNodeId=null;
        nestInto(id, el.dataset.gdir); clearDragOver(); return; }
      const fromId=+dragDirId, toId=+el.dataset.gdir;
      if(fromId===toId) return;
      const arr=data.goal||[];
      const fi=arr.findIndex(n=>n.id===fromId), ti=arr.findIndex(n=>n.id===toId);
      if(fi<0||ti<0) return;
      const [moved]=arr.splice(fi,1); arr.splice(ti,0,moved);
      persist(); });
  });
}
function goalDelConfirm(node){ if(!node) return;
  const n=goalTreeCount(node), ids=new Set(goalSubtreeIds(node));
  const linked=(data.todo||[]).filter(t=>t.goalId&&ids.has(String(t.goalId)));
  const doneN=linked.filter(t=>!isRepeat(t)&&t.done).length;
  const taskTip=linked.length
    ? `它和子项关联的 ${linked.length} 项任务（其中 ${doneN} 项已完成）不会被删除：任务记录保留（是否显示在今日计划取决于各自的安排状态），只解除目标关联，完成状态和日期照旧。想删任务本身，请到目标树任务行打开编辑后删除。`
    : `它和子项下没有关联任务。`;
  const e=goalIndex()[node.id]; const parent=e?e.parentNode:null;
  let before=null, after=null;
  if(parent){
    before=nodePct(parent);
    const bak=parent.children; parent.children=(bak||[]).filter(c=>c!==node);
    after=nodePct(parent); parent.children=bak;      // 仅预览，不改数据
  }
  const delta=(before!=null&&after!=null&&before!==after)?` 上级进度会从 ${before}% 变为 ${after}%（比例调整，不是成果丢失）。`:'';
  askConfirm("删除目标节点",`只删除目标结构本身，会连同它下面的 ${n-1} 个子项一起从树里移除。${taskTip}${delta}`,"删除",()=>{
    const b=parent?nodePct(parent):null;
    const moved=goalRemove(node.id); persist();
    if(parent&&b!=null){ const a=nodePct(parent); if(a!==b) toast(`删除子目标后，上级进度 ${b}% → ${a}%`); }
    if(moved) toast(`${moved} 项任务已保留（仅解除目标关联，是否在今日计划取决于各自安排状态）`);
  });
}
/* 从任意目标节点「加执行任务」= 新建一条任务并关联过去；默认只属于目标树，不自动进今日计划 */
function addTask(week, title){
  const draft=newItem(modOf("todo")); draft.goalId=week.id; draft.sched=false; if(title) draft.title=title;
  openEditor("todo", draft, { isNew:true });
}
/* 新建时选的层级标签：子目标只是默认名，可以一直往下拆；执行任务 = 新建任务并关联当前节点（默认不进今日计划） */
const GOAL_PICK=[{k:"goal",n:"总目标"},{k:"stage",n:"阶段目标"},{k:"week",n:"子目标"},{k:"day",n:"执行任务"}];
/* 进度模式三选一：自动汇总 / 手动 / 完成状态；切换只换算法，历史记录不动 */
function goalModeHTML(mode,d){
  if(mode==="manual") return `<div class="field"><label>当前进度（%）</label><input id="f-gman" type="number" min="0" max="100" value="${(d&&d.pMode==='manual'&&d.pManual!=null)?attr(d.pManual):''}" placeholder="填写实际完成到多少，0–100"/></div>`;
  if(mode==="check") return `<div class="field"><label>完成状态</label><div class="seg" id="f-gchk">
      <div class="opt ${d&&d.pDone?'on':''}" data-pdone="1">已完成</div>
      <div class="opt ${!d||!d.pDone?'on':''}" data-pdone="0">未完成</div></div></div>`;
  return `<div class="gm">按已有的任务和子目标自动计算；循环任务按本周完成率折算计入，本周无排期的不计；还没拆出来的内容不进分母，不会把进度拉低。</div>`;
}
function goalModeHint(node,mode){
  if(!node) return mode==="manual"?"保存后按你填的百分比显示，不随拆解变化。":mode==="check"?"保存后只显示「已完成 / 未完成」。":"保存后按子目标和任务自动汇总；循环任务按本周完成率折算。";
  const cur=nodePct(node);
  if(mode===(node.pMode||"auto")) return `当前进度 ${cur}%，模式不变。`;
  if(mode==="auto"){ const t=nodePct({...node,pMode:"auto"}); return `切换后按子目标自动汇总，当前为 ${t}%；原手动进度保留在数据里，但不再参与计算。`; }
  if(mode==="manual") return node.pMode==="manual"?`当前手动进度 ${cur}%。`:`当前自动进度 ${cur}%；切换为手动后请重新填写，不会自动继承这个数字。`;
  return `切换后只按「已完成 / 未完成」显示，不再显示百分比。`;
}
function goalFieldHTML(lvKey,d,node){
  const ph={ direction:"例如：💼 职业", goal:"例如：成为更强的测试工程师", stage:"例如：提升自动化测试能力", week:"例如：补完权限测试用例" }[lvKey]||"";
  let f=`<div class="field"><label>名称</label><input id="f-gtitle" value="${attr(d.title)}" placeholder="${attr(ph)}"/></div>`;
  if(lvKey==="direction"){
    f+=`<div class="field"><label>当前阶段</label><input id="f-gstage" value="${attr(d.stage||'')}" placeholder="例如：寻找稳定的测试岗位"/></div>
      <div class="field"><label>近期推进</label><input id="f-gweek" value="${attr(d.week||'')}" placeholder="例如：完善项目经历"/></div>`;
  } else {
    f+=`<div class="field"><label>预期完成时间（可选）</label><input id="f-gdeadline" value="${attr(d.deadline||'')}" placeholder="留空也行，例如：本季度 / 年底"/></div>`;
  }
  const mode=d.pMode||"auto";
  f+=`<div class="field"><label>进度模式</label><div class="seg" id="f-gmode">
      <div class="opt ${mode==='auto'?'on':''}" data-pmode="auto">子目标自动</div>
      <div class="opt ${mode==='manual'?'on':''}" data-pmode="manual">手动进度</div>
      <div class="opt ${mode==='check'?'on':''}" data-pmode="check">完成状态</div></div></div>
    <div id="f-gmodewrap">${goalModeHTML(mode,d)}</div>
    <div class="gmhint" id="f-gmodehint">${esc(goalModeHint(node||null,mode))}</div>`;
  return f;
}
function goalTip(lvKey){
  if(lvKey==="week") return "子目标是阶段目标下面的通用拆解层，可以继续往下加，层数不限；进度默认 = 它下面「执行任务」的完成比例，也可以改成手动或完成状态。执行任务默认不进今日计划，需要时再主动安排。";
  if(lvKey==="direction") return "方向是你长期推进的一条主线，进度默认由下面的目标自动汇总，也可以手动标进度。";
  return "这一层默认由下面的子项自动汇总；还没拆出内容时显示「尚未拆解」，不影响上级进度。";
}
/* 目标节点编辑弹窗（方向 / 总目标 / 阶段 / 子目标各自的字段略有不同） */
function openGoalEditor(node, parent){
  const editing=!!node;
  let lvKey=node?node.lv:(parent?(GOAL_NEXT[parent.lv]||parent.lv):"direction");
  const d=node||{ lv:lvKey, title:"", stage:"", week:"", deadline:"", children:[] };
  let mode=d.pMode||"auto";
  const pickable=!editing&&!!parent;   // 有父节点时才让选层级；新建方向固定顶层
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:460px"><h3 id="f-gh">${editing?'编辑':'新建'} · ${GOAL_LV[lvKey].name}</h3>
    ${pickable?`<div class="field"><label>建在哪一层</label><div class="seg" id="f-glevel">${GOAL_PICK.map(o=>`<div class="opt ${o.k===lvKey?'on':''}" data-lv="${o.k}">${o.n}</div>`).join("")}</div></div>`:''}
    <div class="sub" id="f-gtip">${goalTip(lvKey)}</div>
    <div id="f-gfields">${goalFieldHTML(lvKey,d,node)}</div>
    <div class="modal-actions">${editing?`<button class="link-quiet" id="m-arc">归档</button><button class="link-danger" id="m-del">删除</button>`:''}<div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); goalDelConfirm(d); };
  if(editing) overlay.querySelector("#m-arc").onclick=()=>{ close(); goalArchive(d); persist();
    toast("已归档："+d.title+"（右侧「已归档」里可恢复）"); };
  const bindCheck=()=>{
    const seg=overlay.querySelector("#f-gchk"); if(!seg) return;
    seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
      d.pDone=o.dataset.pdone==="1";
      seg.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",(x.dataset.pdone==="1")===d.pDone));
    });
  };
  const bindMode=()=>{
    const seg=overlay.querySelector("#f-gmode"); if(!seg) return;
    seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
      if(o.dataset.pmode===mode) return;
      mode=o.dataset.pmode;
      seg.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x.dataset.pmode===mode));
      overlay.querySelector("#f-gmodewrap").innerHTML=goalModeHTML(mode,d);
      const h=overlay.querySelector("#f-gmodehint"); if(h) h.textContent=goalModeHint(node,mode);
      bindCheck();
    });
    bindCheck();
  };
  bindMode();
  if(pickable){
    overlay.querySelectorAll("#f-glevel .opt").forEach(o=>o.onclick=()=>{
      const k=o.dataset.lv; if(k===lvKey) return;
      const cur=(overlay.querySelector("#f-gtitle")||{}).value||"";
      if(k==="day"){ close(); addTask(parent, cur.trim()); return; }   // 执行任务直接进任务表单（默认不进今日计划）
      lvKey=k;
      overlay.querySelectorAll("#f-glevel .opt").forEach(x=>x.classList.toggle("on",x.dataset.lv===k));
      overlay.querySelector("#f-gh").textContent=`新建 · ${GOAL_LV[k].name}`;
      overlay.querySelector("#f-gtip").textContent=goalTip(k);
      overlay.querySelector("#f-gfields").innerHTML=goalFieldHTML(k,d,null);
      bindMode();
      const el=overlay.querySelector("#f-gtitle"); if(el){ el.value=cur; el.focus(); }
    });
  }
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:""; };
    const title=(val("#f-gtitle")||"").trim(); if(!title){ toast("先写个名称"); return; }
    let man=null;
    if(mode==="manual"){
      const raw=(val("#f-gman")||"").trim(), num=Number(raw);
      if(raw===""||isNaN(num)||num<0||num>100){ toast("手动进度请填 0–100 之间的数字"); return; }
      man=Math.round(num);
    }
    const prevMode=editing?(d.pMode||"auto"):null;
    let notice="";
    if(!editing){
      const nn={ id:Date.now(), lv:lvKey, title, children:[] };
      if(lvKey==="direction"){ nn.stage=(val("#f-gstage")||"").trim(); nn.week=(val("#f-gweek")||"").trim(); }
      else nn.deadline=(val("#f-gdeadline")||"").trim();
      nn.pMode=mode;
      if(mode==="manual") nn.pManual=man;
      if(mode==="check") nn.pDone=!!d.pDone;
      if(parent){
        const before=nodePct(parent);
        parent.children=parent.children||[]; parent.children.push(nn);
        data.__goalOpen=data.__goalOpen||{}; data.__goalOpen[parent.id]=true;
        const after=nodePct(parent);
        if(after!==before) notice=`新增子目标后，上级进度 ${before}% → ${after}%：是分母变大导致的比例调整，不是已完成成果丢失。`;
      } else { data.goal=data.goal||[]; data.goal.push(nn); }
    } else {
      d.title=title;
      if(lvKey==="direction"){ d.stage=(val("#f-gstage")||"").trim(); d.week=(val("#f-gweek")||"").trim(); }
      else d.deadline=(val("#f-gdeadline")||"").trim();
      d.pMode=mode;
      if(mode==="manual") d.pManual=man;      // 切回自动时不清空 pManual，历史手动值保留但不参与计算
      if(mode==="check") d.pDone=!!d.pDone;
      if(prevMode!==mode){
        if(mode==="manual") notice=`已切换为手动进度 ${man}%，不再与子目标计算相加。`;
        else if(mode==="check") notice=`已切换为完成状态：${d.pDone?'已完成':'未完成'}。`;
        else notice=`已切换为子目标自动汇总，当前 ${nodePct(d)}%`+(prevMode==="manual"?"；原手动百分比保留在数据里，不重复累计。":"。");
      }
    }
    persist(); close();
    if(notice) toast(notice);
  };
  setTimeout(()=>{ const el=overlay.querySelector("#f-gtitle"); if(el) el.focus(); },30);
}

/* ---------- 本地资料（文档阅读，账户里搜不到的私藏） ---------- */
const RD_FONT_MIN=13, RD_FONT_MAX=30, RD_CHAR_MAX=2000000;
let rdCi=0;                       // 当前章节下标

/* 把纯文本按「第X章 / Chapter N / 序章」拆成章节；找不到就整体当一章
   判定：整行以章节标记开头、不超过 40 字、且不含句读标点（避免把「第二章的正文。」这类正文误当成标题） */
function splitChapters(text){
  const src=String(text).replace(/\r\n?/g,"\n");
  const head=/^\s*(第\s*[0-9一二三四五六七八九十百千零两]+\s*[章节回卷篇幕]|序章|楔子|番外|Chapter\s+\d+|CHAPTER\s+\d+)/;
  const punct=/[。，！？；：、,.;:!?"“”‘’（）()《》〈〉…—]/;
  const chs=[]; let cur=null;
  src.split("\n").forEach(raw=>{
    const ln=raw.trim();
    if(ln && ln.length<=40 && !punct.test(ln) && head.test(ln)){ cur={ title:ln, buf:[] }; chs.push(cur); }
    else{
      if(!cur){ cur={ title:"全文", buf:[] }; chs.push(cur); }
      if(ln) cur.buf.push(ln); else cur.buf.push("");
    }
  });
  const out=chs.map(c=>({ title:c.title, body:c.buf.join("\n").replace(/\n{3,}/g,"\n\n").trim() })).filter(c=>c.title||c.body);
  return out.length?out:[{ title:"全文", body:src.trim() }];
}

/* 中文 txt 常见 GBK：先按 utf-8 读，出现乱码再退回 gbk */
function readTextSmart(file, done){
  const r=new FileReader();
  r.onload=()=>{
    const buf=r.result; let txt=new TextDecoder("utf-8").decode(buf);
    if(txt.indexOf("\uFFFD")>=0){ try{ txt=new TextDecoder("gbk").decode(buf); }catch(e){} }
    done(txt);
  };
  r.readAsArrayBuffer(file);
}
function importTxt(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".txt,text/plain";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    readTextSmart(f, txt=>addDoc(f.name.replace(/\.[^.]+$/,""), txt));
  };
  inp.click();
}
function addDoc(title, text){
  const body=String(text||"");
  if(!body.trim()){ toast("这个是空文件，没读到内容"); return; }
  if(body.length>RD_CHAR_MAX){ toast("这份太大了（超过约 200 万字符），换小一点的再试"); return; }
  const doc={ id:Date.now(), title:(title||"").trim()||"未命名文档", chapters:splitChapters(body) };
  rd.docs.push(doc); rd.cur=rd.docs.length-1; rd.pos[doc.id]={ci:0,pi:0};
  rdSave(); render(); toast(`已导入 · 拆出 ${doc.chapters.length} 个章节`);
}
function pasteDoc(){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:580px"><h3>粘贴文本</h3><div class="sub">保存后会按「第X章」自动拆成目录</div>
    <div class="field"><label>名称</label><input id="p-title" placeholder="给这份文档起个名字"/></div>
    <div class="field"><label>正文</label><textarea id="p-body" style="min-height:230px" placeholder="把文字粘贴到这里…"></textarea></div>
    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="p-cancel">取消</button><button class="btn" id="p-ok">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#p-cancel").onclick=close;
  overlay.querySelector("#p-ok").onclick=()=>{
    const t=overlay.querySelector("#p-title").value.trim();
    const b=overlay.querySelector("#p-body").value;
    close(); addDoc(t,b);
  };
}

function renderReader(){
  const docs=rd.docs;
  const head=`<div class="header"><div><h2>本地资料</h2><p>导入本地 .txt 或粘贴文本，自动按章生成目录；读到哪会自己记住</p></div>
    <div class="spacer"></div><span class="date-chip">${icon("file",14)} ${docs.length} 份文档</span></div>`;

  if(!docs.length){
    $("#screen").innerHTML=head+`<div class="rd-pane" style="margin-top:16px"><div class="rd-empty">
      <span class="rd-e-ic">${icon("file",26)}</span>
      <h3>这里还没有东西</h3>
      <p>把电脑里的 .txt 拖到这块区域，或者点下面按钮选一个文件、直接粘贴一段文本。<br/>会按「第X章」自动拆成目录，关掉浏览器下次打开还能接着看。</p>
      <div class="row"><button class="btn" id="rd-import">${icon("upload",16,2.2)}导入 txt</button>
        <button class="btn ghost" id="rd-paste">${icon("plus",16,2.2)}粘贴文本</button></div>
    </div></div>`;
    wireReader(); return;
  }

  rd.cur=Math.max(0,Math.min(rd.cur||0,docs.length-1));
  const doc=docs[rd.cur];
  const pos=rd.pos[doc.id]||{ci:0,pi:0};
  rdCi=Math.max(0,Math.min(pos.ci||0,doc.chapters.length-1));
  const ch=doc.chapters[rdCi];
  const paras=(ch.body||"").split(/\n\s*\n/).filter(p=>p.trim());
  rdPara=Math.max(0,Math.min(pos.pi||0,Math.max(0,paras.length-1)));
  const st=rd.settings;

  const toc=doc.chapters.map((c,i)=>`<div class="tc ${i===rdCi?'on':''}" data-ci="${i}" title="${attr(c.title)}">${esc(c.title)}</div>`).join("");
  const docOpts=docs.map((d,i)=>`<option value="${i}"${i===rd.cur?" selected":""}>${esc(d.title)}</option>`).join("");
  const chOpts=doc.chapters.map((c,i)=>`<option value="${i}"${i===rdCi?" selected":""}>${esc(c.title)}</option>`).join("");

  $("#screen").innerHTML=head+`
  <div class="toolbar" style="margin-top:12px">
    <button class="btn" id="rd-import">${icon("upload",16,2.2)}导入 txt</button>
    <button class="btn ghost" id="rd-paste">${icon("plus",16,2.2)}粘贴文本</button>
    <div class="spacer"></div>
    <button class="btn ghost" id="rd-drop">${icon("trash",15)}移除这篇</button>
  </div>
  <div class="rd-wrap">
    <aside class="rd-toc"><div class="rh">${icon("list",14)} 目录 · ${doc.chapters.length} 章</div>${toc}</aside>
    <div class="rd-pane">
      <div class="rd-bar">
        <select class="rd-tool" id="rd-doc" style="max-width:190px">${docOpts}</select>
        <select class="rd-tool" id="rd-ch" style="max-width:170px">${chOpts}</select>
        <div class="spacer"></div>
        <span class="rpos" id="rd-pos">文档 ${rd.cur+1}/${docs.length} · 段落 ${rdPara+1}/${Math.max(1,paras.length)}</span>
        <button class="rd-tool" id="rd-fm" title="字号变小">A−</button>
        <button class="rd-tool" id="rd-fw" title="字号变大">A＋</button>
        <button class="rd-tool" id="rd-ln" title="切换行距">行距 ${st.line.toFixed(1)}</button>
        <button class="rd-tool" id="rd-wd" title="切换页宽">页宽 ${st.width}</button>
      </div>
      <div class="rd-scroll" id="rd-scroll"><div class="rd-body" id="rd-body" style="max-width:${st.width}px;font-size:${st.font}px;line-height:${st.line}">
        <div class="rd-title" style="font-size:${st.font+3}px">${esc(ch.title)}</div>
        ${paras.map((p,i)=>`<p data-p="${i}">${esc(p)}</p>`).join("")}
      </div></div>
      <div class="rd-foot">← → 换章节 · ↑ ↓ / 空格 翻页 · Alt+Q 一键换页面</div>
    </div>
  </div>`;
  wireReader();
}

function wireReader(){
  const imp=$("#rd-import"), pas=$("#rd-paste"), drp=$("#rd-drop");
  if(imp) imp.onclick=importTxt;
  if(pas) pas.onclick=pasteDoc;
  if(drp) drp.onclick=()=>{
    const doc=rd.docs[rd.cur]; if(!doc) return;
    askConfirm("移除这篇文档",`会把「${doc.title}」和它的阅读位置一起清掉，清掉就找不回来了。`,"移除",()=>{
      delete rd.pos[doc.id]; rd.docs.splice(rd.cur,1);
      rd.cur=Math.max(0,Math.min(rd.cur,rd.docs.length-1)); rdSave(); render();
    });
  };
  const ds=$("#rd-doc"); if(ds) ds.onchange=()=>{ rd.cur=+ds.value; rdSave(); render(); };
  const cs=$("#rd-ch"); if(cs) cs.onchange=()=>goChapter(+cs.value);
  $("#screen").querySelectorAll(".rd-toc .tc").forEach(el=>el.onclick=()=>goChapter(+el.dataset.ci));
  const fm=$("#rd-fm"), fw=$("#rd-fw"), ln=$("#rd-ln"), wd=$("#rd-wd");
  if(fm) fm.onclick=()=>{ rd.settings.font=Math.max(RD_FONT_MIN,rd.settings.font-1); rdSave(); applyRdStyle(); };
  if(fw) fw.onclick=()=>{ rd.settings.font=Math.min(RD_FONT_MAX,rd.settings.font+1); rdSave(); applyRdStyle(); };
  if(ln) ln.onclick=()=>{ const arr=[1.5,1.75,2.0,2.3]; const i=arr.findIndex(v=>v>=rd.settings.line-0.01);
    rd.settings.line=arr[(i+1)%arr.length]; ln.textContent=`行距 ${rd.settings.line.toFixed(1)}`; rdSave(); applyRdStyle(); };
  if(wd) wd.onclick=()=>{ const arr=[620,740,880]; const i=arr.findIndex(v=>v>=rd.settings.width-1);
    rd.settings.width=arr[(i+1)%arr.length]; wd.textContent=`页宽 ${rd.settings.width}`; rdSave(); applyRdStyle(); };
  const sc=$("#rd-scroll");
  if(sc){
    sc.onscroll=()=>{ updateRdPara(); clearTimeout(rdTimer); rdTimer=setTimeout(saveRdPos,400); };
    const p=sc.querySelector(`[data-p="${rdPara}"]`);         // 回到上次读到的那一段
    sc.scrollTop=p?Math.max(0,p.offsetTop-16):0;
    updateRdPara();
  }
  const pane=document.querySelector(".rd-pane");              // 顺手支持把 txt 拖进来
  if(pane){
    pane.addEventListener("dragover",e=>{ e.preventDefault(); });
    pane.addEventListener("drop",e=>{ e.preventDefault();
      const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return;
      readTextSmart(f,txt=>addDoc(f.name.replace(/\.[^.]+$/,""),txt)); });
  }
}
function applyRdStyle(){
  const b=$("#rd-body"); if(!b) return; const st=rd.settings;
  b.style.maxWidth=st.width+"px"; b.style.fontSize=st.font+"px"; b.style.lineHeight=st.line;
  const t=b.querySelector(".rd-title"); if(t) t.style.fontSize=(st.font+3)+"px";
}
function updateRdPara(){
  const sc=$("#rd-scroll"), b=$("#rd-body"); if(!sc||!b) return;
  const ps=b.querySelectorAll("p"); if(!ps.length) return;
  const top=sc.scrollTop+8; let idx=0;
  ps.forEach((p,i)=>{ if(p.offsetTop<=top) idx=i; });
  rdPara=idx;
  const el=$("#rd-pos");
  if(el) el.textContent=`文档 ${rd.cur+1}/${rd.docs.length} · 段落 ${idx+1}/${ps.length}`;
}
function saveRdPos(){
  const doc=rd.docs[rd.cur]; if(!doc) return;
  rd.pos[doc.id]={ ci:rdCi, pi:rdPara }; rdSave();
}
function goChapter(i){
  const doc=rd.docs[rd.cur]; if(!doc) return;
  const n=Math.max(0,Math.min(i,doc.chapters.length-1));
  rdCi=n; rdPara=0; rd.pos[doc.id]={ci:n,pi:0}; rdSave(); render();
}
function rdTurn(dir){
  const doc=rd.docs[rd.cur]; if(!doc) return;
  const n=rdCi+dir;
  if(n<0||n>doc.chapters.length-1){ toast(dir>0?"已经是最后一章了":"已经是第一章了"); return; }
  goChapter(n);
}
function rdAutoNext(){ const doc=rd.docs[rd.cur]; if(!doc||rdCi>=doc.chapters.length-1) return; goChapter(rdCi+1); }

/* 阅读页快捷键：← → 换章，↑ ↓ / 空格 翻页，翻到底自动跳下一章；Alt+Q 全局老板键 */
document.addEventListener("keydown",e=>{
  /* F12 切换 DevTools：通过 Rust 命令 toggle_devtools 实现（Tauri v2 发布版也生效，
     依赖 Cargo.toml 的 devtools feature + lib.rs 的 toggle_devtools 命令） */
  if(e.key==="F12"){ e.preventDefault();
    const core = window.__TAURI__ && window.__TAURI__.core;
    if(core && typeof core.invoke==="function"){
      core.invoke("toggle_devtools").catch(()=>{ /* 浏览器预览时静默忽略 */ });
    } else {
      /* 纯浏览器预览：调不出原生 DevTools，但至少不报错 */
      console.log("[F12] 非 Tauri 环境，跳过");
    }
    return; }
  if(e.altKey && (e.key==="q"||e.key==="Q")){ e.preventDefault(); toggleBoss(); return; }
  if(e.altKey && (e.key==="w"||e.key==="W")){ e.preventDefault(); toggleMode(); return; }
  if(boss || view!=="docs") return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select"||e.ctrlKey||e.metaKey||e.altKey) return;
  const sc=$("#rd-scroll"); if(!sc) return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); rdTurn(-1); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); rdTurn(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); sc.scrollTop-=64; }
  else if(e.key==="ArrowDown"){ e.preventDefault(); if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-8) rdAutoNext(); else sc.scrollTop+=64; }
  else if(e.key===" "||e.key==="Spacebar"){ e.preventDefault();
    if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-8) rdAutoNext(); else sc.scrollTop+=sc.clientHeight*0.86; }
});

/* ---------- 头像裁剪：方框内拖动定位 + 缩放，确认后存 192×192 小图 ---------- */
function openAvatarCropper(src){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:380px"><h3>调整头像</h3><div class="sub">拖动图片摆位置，滑杆缩放，确认后自动裁成方形</div>
    <div class="crop-stage" id="cv-stage"><canvas id="cv" width="280" height="280"></canvas></div>
    <div class="crop-zoom"><span>缩小</span><input type="range" id="cv-zoom" min="1" max="3" step="0.01" value="1"/><span>放大</span></div>
    <div class="modal-actions"><button class="btn ghost" id="cv-cancel">取消</button><div class="spacer"></div><button class="btn" id="cv-ok">就用这张</button></div></div>`;
  document.body.appendChild(overlay);
  const cv=overlay.querySelector("#cv"), ctx=cv.getContext("2d");
  const img=new Image();
  let scale=1, base=1, ox=0, oy=0, dragging=false, lx=0, ly=0;
  const clamp=()=>{ const w=img.width*base*scale, h=img.height*base*scale;
    ox=Math.min(0, Math.max(280-w, ox)); oy=Math.min(0, Math.max(280-h, oy)); };
  const draw=()=>{ ctx.clearRect(0,0,280,280); ctx.drawImage(img, ox, oy, img.width*base*scale, img.height*base*scale); };
  img.onload=()=>{ base=Math.max(280/img.width, 280/img.height);
    ox=(280-img.width*base)/2; oy=(280-img.height*base)/2; draw(); };
  img.src=src;
  const stage=overlay.querySelector("#cv-stage");
  stage.addEventListener("pointerdown",e=>{ dragging=true; lx=e.clientX; ly=e.clientY; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove",e=>{ if(!dragging) return;
    ox+=e.clientX-lx; oy+=e.clientY-ly; lx=e.clientX; ly=e.clientY; clamp(); draw(); });
  stage.addEventListener("pointerup",()=>dragging=false);
  stage.addEventListener("pointercancel",()=>dragging=false);
  overlay.querySelector("#cv-zoom").oninput=e=>{ const z=+e.target.value;
    ox=140-(140-ox)*(z/scale); oy=140-(140-oy)*(z/scale); scale=z; clamp(); draw(); };
  overlay.querySelector("#cv-cancel").onclick=()=>overlay.remove();
  overlay.onclick=ev=>{ if(ev.target===overlay) overlay.remove(); };
  overlay.querySelector("#cv-ok").onclick=()=>{
    const out=document.createElement("canvas"); out.width=out.height=192;
    const k=192/280;
    out.getContext("2d").drawImage(img, ox*k, oy*k, img.width*base*scale*k, img.height*base*scale*k);
    let url=out.toDataURL("image/png");
    if(url.length>300000){   // 万一太大，转 JPEG 兜底
      const o2=document.createElement("canvas"); o2.width=o2.height=192; const c2=o2.getContext("2d");
      c2.fillStyle="#fff"; c2.fillRect(0,0,192,192); c2.drawImage(out,0,0);
      url=o2.toDataURL("image/jpeg",0.85);
    }
    data.__avatar=url; setAvatar(url); store.save(); overlay.remove(); toast("头像已更新");
  };
}

/* ---------- 自绘标题栏：窗口按钮与双击最大化（仅在 Tauri 环境接管，浏览器预览不生效） ---------- */
(function bindTitlebar(){
  const tw = window.__TAURI__ && window.__TAURI__.window;
  if(!tw || !tw.getCurrentWindow) return;
  const win = tw.getCurrentWindow();
  document.querySelectorAll("[data-winact]").forEach(el=>{
    el.addEventListener("click", e=>{
      e.stopPropagation();
      const a = el.dataset.winact;
      if(a==="min") win.minimize();
      else if(a==="max") win.toggleMaximize();
      else if(a==="close") win.close();
    });
  });
  const bar = document.querySelector(".tbar");
  bar.addEventListener("dblclick", e=>{ if(e.target.closest(".tb-btn")) return; win.toggleMaximize(); });

  /* 最小窗口尺寸：固定为首页刚好完整展示的尺寸（CSS 1517×997），拖拽缩小会被回弹 */
  const MIN_CSS_W = 1517, MIN_CSS_H = 997;
  const minPhysical = ()=>{ const dpr = window.devicePixelRatio || 1;
    return { w: Math.round(MIN_CSS_W*dpr), h: Math.round(MIN_CSS_H*dpr) }; };
  const clampSize = async ()=>{
    try{
      const p = minPhysical();
      const s = await win.innerSize();
      if(s.width < p.w || s.height < p.h) await win.setSize(new tw.PhysicalSize(p.w, p.h));
    }catch(e){}
  };
  (async()=>{
    try{
      const p = minPhysical(), sf = (await win.scaleFactor()) || 1;
      if(win.setMinSize) await win.setMinSize(new tw.LogicalSize(p.w/sf, p.h/sf));
    }catch(e){}
  })();
  win.onResized(()=>clampSize());
})();
</script>
